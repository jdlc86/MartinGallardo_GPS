<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><title>Vehículos · ParkingMartin-G</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>:root{color-scheme:dark;--bg:#08111f;--card:#101d30;--text:#eef5ff;--muted:#91a4bb;--line:#ffffff16;--blue:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}.app{max-width:640px;margin:auto;padding:22px 16px 34px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{margin:2px 0;font-size:28px}.ey{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7dd3fc;font-weight:900}.search{margin-top:18px;display:flex;gap:8px}.search input{flex:1;border:1px solid var(--line);background:var(--card);color:#fff;border-radius:15px;padding:13px 14px;font:inherit;text-transform:uppercase}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.s,.item,.state{background:var(--card);border:1px solid var(--line);border-radius:18px}.s{padding:12px;text-align:center}.s b{display:block;font-size:20px}.s span{font-size:10px;color:var(--muted)}.state{margin-top:16px;padding:18px;color:var(--muted);text-align:center}.list{margin-top:16px}.item{padding:14px;margin-bottom:9px;display:flex;gap:12px;align-items:center}.plate{font-size:18px;font-weight:950;letter-spacing:.03em}.info{flex:1}.info small{display:block;color:var(--muted);margin-top:4px}.pill{font-size:9px;font-weight:900;padding:6px 8px;border-radius:999px;background:#ffffff0d}.parked{color:#6ee7b7;background:#10b98118}.moving{color:#fbbf24;background:#f59e0b18}.done{color:#9ca3af;background:#ffffff0b}.back{width:100%;margin-top:18px;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:#fff;font-weight:850}</style></head><body><main class="app"><div class="top"><div><div class="ey">Flota en tiempo real</div><h1>Vehículos</h1></div><div style="font-size:30px">🚘</div></div><div class="search"><input id="q" placeholder="Buscar matrícula"></div><div class="summary"><div class="s"><b id="p">—</b><span>Aparcados</span></div><div class="s"><b id="m">—</b><span>En movimiento</span></div><div class="s"><b id="t">—</b><span>Total</span></div></div><div id="state" class="state">Cargando vehículos…</div><div id="list" class="list"></div><button class="back" onclick="location.href='./?v=20260831S'">← Volver a la App Moderna</button></main><script>const tg=window.Telegram?.WebApp,API='https://mvexykcxnpaywkbnoxwu.supabase.co/functions/v1/telegram-modern-action';if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#08111f');tg.setBackgroundColor('#08111f');tg.setBottomBarColor?.('#08111f')}catch{}}let data=[];const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(d){return d?new Date(d).toLocaleString('es-ES',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'Sin fecha'}function status(v){if(v.status==='parked')return['APARCADO','parked'];if(v.status==='requested'||v.status==='in_transit')return['EN MOVIMIENTO','moving'];return['FINALIZADO','done']}function render(){const q=$('q').value.toUpperCase().replace(/[^A-Z0-9]/g,'');const rows=data.filter(v=>!q||String(v.normalized_plate||v.plate||'').includes(q));$('list').innerHTML=rows.map(v=>{const s=status(v);return `<div class="item" data-plate="${esc(v.plate)}"><div>🚗</div><div class="info"><div class="plate">${esc(v.plate)}</div><small>${esc(v.current_location_text||'Última actualización')} · ${fmt(v.updated_at)}</small></div><span class="pill ${s[1]}">${s[0]}</span></div>`}).join('')||'<div class="state">No hay coincidencias.</div>';document.querySelectorAll('[data-plate]').forEach(x=>x.onclick=()=>location.href='vehicle-v6.html?v=20260831S&plate='+encodeURIComponent(x.dataset.plate))}async function load(){if(!tg?.initData){$('state').textContent='Abre esta pantalla desde Telegram.';return}try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData,action:'vehicles_dashboard'})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Error');data=d.vehicles||[];$('p').textContent=data.filter(v=>v.status==='parked').length;$('m').textContent=data.filter(v=>v.status==='requested'||v.status==='in_transit').length;$('t').textContent=data.length;$('state').hidden=true;render()}catch(e){$('state').textContent='⚠️ '+(e.message||e)}}$('q').addEventListener('input',render);load();</script></body></html>
