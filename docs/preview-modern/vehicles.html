<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=1"><link rel="stylesheet" href="theme.css?v=9" data-pmg-theme><script src="theme.js?v=8" data-pmg-theme></script><script src="ux-errors.js?v=10"></script><title>Vehículos · ParkingMartin-G</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>:root{--bg:var(--pmg-bg);--card:var(--pmg-surface);--text:var(--pmg-text);--muted:var(--pmg-muted);--line:var(--pmg-border)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}.app{max-width:640px;margin:auto;padding:22px 16px 34px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{margin:2px 0;font-size:28px}.ey{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--pmg-accent-text);font-weight:900}.search{margin-top:18px;display:flex;gap:8px}.search input{flex:1;border:1px solid var(--line);background:var(--pmg-input);color:var(--text);border-radius:15px;padding:13px 14px;font:inherit;text-transform:uppercase}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.s,.item,.state{background:var(--card);border:1px solid var(--line);border-radius:18px}.s{padding:12px;text-align:center}.s b{display:block;font-size:20px}.s span{font-size:10px;color:var(--muted)}.state{margin-top:16px;padding:18px;color:var(--muted);text-align:center}.list{margin-top:16px}.item{padding:14px;margin-bottom:9px;display:flex;gap:12px;align-items:center;cursor:pointer}.plate{font-size:18px;font-weight:950;letter-spacing:.03em}.info{flex:1;min-width:0}.info small{display:block;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill{font-size:9px;font-weight:900;padding:6px 8px;border-radius:999px;white-space:nowrap}.picked{color:var(--pmg-info-text);background:var(--pmg-info-soft)}.parked{color:var(--pmg-success-text);background:var(--pmg-success-soft)}.relocated{color:var(--pmg-accent-text);background:color-mix(in srgb,var(--pmg-accent) 16%,transparent)}.delivered{color:var(--pmg-muted);background:var(--pmg-soft)}.history{margin-top:6px;font-size:9px;color:var(--pmg-muted);font-weight:800}.back{width:100%;margin-top:18px;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:850}@media(max-width:420px){.s{padding:11px 6px}.s span{font-size:9px}.item{padding:13px 11px}.plate{font-size:17px}}</style></head><body><main class="app"><div class="top"><div><div class="ey">Ciclo de vida de la flota</div><h1>Vehículos</h1></div><div style="font-size:30px">🚘</div></div><div class="search"><input id="q" placeholder="Buscar matrícula" autocomplete="off"></div><div class="summary"><div class="s"><b id="picked">—</b><span>Recogidos</span></div><div class="s"><b id="parked">—</b><span>Aparcados</span></div><div class="s"><b id="delivered">—</b><span>Entregados</span></div></div><div id="state" class="state">Cargando vehículos…</div><div id="list" class="list"></div><button class="back" onclick="location.href='./?v=20260831NAV2'">← Volver al inicio</button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const tg=window.Telegram?.WebApp;
const API='https://mvexykcxnpaywkbnoxwu.supabase.co/functions/v1/vehicle-lifecycle-api';
const SB_URL='https://mvexykcxnpaywkbnoxwu.supabase.co',SB_KEY='sb_publishable_CtdeA8WPS-9bQhAC7_8e_w_5sBiNktm';
if(tg){tg.ready();tg.expand();window.PMGTheme?.apply()}
let data=[],stats={picked_up:0,parked:0,delivered:0},historical=null,expiryTimer=null,searchTimer=null,searchSeq=0,rtClient=null,rtChannel=null,wasSubscribed=false;
const $=id=>document.getElementById(id);
const norm=s=>String(s??'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(d){return d?new Date(d).toLocaleString('es-ES',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'Sin fecha'}
function status(v){if(v.status==='RECOGIDO')return['RECOGIDO','picked'];if(v.status==='APARCADO')return['APARCADO','parked'];if(v.status==='REUBICADO')return['REUBICADO','relocated'];return['ENTREGADO','delivered']}
function scheduleExpiry(){clearTimeout(expiryTimer);const now=Date.now(),times=data.filter(v=>v.status==='ENTREGADO'&&v.expires_at).map(v=>new Date(v.expires_at).getTime()).filter(t=>t>now).sort((a,b)=>a-b);if(!times.length)return;expiryTimer=setTimeout(()=>loadSnapshot(),Math.max(250,times[0]-now+250))}
function paintStats(){$('picked').textContent=Number(stats.picked_up||0);$('parked').textContent=Number(stats.parked||0);$('delivered').textContent=Number(stats.delivered||0)}
function row(v){const s=status(v),hist=!!v.historical;return `<div class="item" data-plate="${esc(v.plate)}"><div>🚗</div><div class="info"><div class="plate">${esc(v.plate)}</div><small>${esc(v.current_location_text||'Última actualización')} · ${fmt(v.operation_at||v.updated_at)}</small>${hist?'<div class="history">HISTÓRICO · fuera de la flota visible de 24 h</div>':''}</div><span class="pill ${s[1]}">${s[0]}</span></div>`}
function render(){const q=norm($('q').value);let rows=data.filter(v=>!q||norm(v.normalized_plate||v.plate).includes(q));if(historical&&q&&norm(historical.normalized_plate||historical.plate)===q&&!rows.some(v=>norm(v.normalized_plate||v.plate)===q))rows=[historical,...rows];$('list').innerHTML=rows.map(row).join('')||'<div class="state">No hay coincidencias.</div>';document.querySelectorAll('[data-plate]').forEach(x=>x.onclick=()=>location.href='vehicle-v7.html?v=20260901LIFE1&plate='+encodeURIComponent(x.dataset.plate))}
async function api(action,extra={}){if(!tg?.initData)throw new Error('missing_user');const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData,action,...extra})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'network_error');return d}
async function loadSnapshot(){try{const d=await api('snapshot');data=d.vehicles||[];stats=d.stats||{};paintStats();$('state').hidden=true;render();scheduleExpiry()}catch(e){$('state').hidden=false;$('state').textContent='⚠️ '+(window.PMGFriendlyError?PMGFriendlyError(e):e.message||e)}}
async function searchHistorical(value,seq){const q=norm(value);if(q.length<4){historical=null;render();return}try{const d=await api('search',{plate:q});if(seq!==searchSeq)return;historical=d.vehicle||null;render()}catch{if(seq===searchSeq){historical=null;render()}}}
$('q').addEventListener('input',()=>{historical=null;render();clearTimeout(searchTimer);const value=$('q').value,seq=++searchSeq;searchTimer=setTimeout(()=>searchHistorical(value,seq),250)});
function connectRealtime(){try{if(!window.supabase?.createClient)return;rtClient=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});rtChannel=rtClient.channel('parking-reservations').on('broadcast',{event:'changed'},msg=>{if(msg?.payload?.table==='parking_events')loadSnapshot()}).subscribe(status=>{if(status==='SUBSCRIBED'){if(wasSubscribed&&!document.hidden)loadSnapshot();wasSubscribed=true}})}catch{}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadSnapshot()});window.addEventListener('pagehide',()=>{clearTimeout(expiryTimer);clearTimeout(searchTimer);if(rtClient&&rtChannel)try{rtClient.removeChannel(rtChannel)}catch{}});
loadSnapshot();connectRealtime();
</script></body></html>
