<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=1"><link rel="stylesheet" href="theme.css?v=9" data-pmg-theme><script src="theme.js?v=8" data-pmg-theme></script><script src="ux-errors.js?v=8"></script><title>Equipo & Accesos</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08111f;color:#eef5ff;font-family:system-ui,-apple-system,sans-serif}.app{max-width:580px;margin:auto;padding:22px 16px 34px}.head{display:flex;justify-content:space-between;align-items:center}.ey{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#91a4bb;font-weight:900}h1{font-size:26px;margin:3px 0}.shield{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#2563eb)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}.stat{padding:13px 6px;border-radius:17px;background:#101d30;border:1px solid rgba(255,255,255,.09);text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:#91a4bb}.state{margin-top:20px;padding:18px;border-radius:18px;background:#101d30;border:1px solid rgba(255,255,255,.09);color:#91a4bb}.state.err{color:#fca5a5;border-color:#ef444455}.section{margin-top:24px}.section h2{font-size:15px;margin:0 0 10px}.card{padding:14px;border-radius:18px;background:#101d30;border:1px solid rgba(255,255,255,.09);margin-bottom:9px}.row{display:flex;align-items:center;gap:10px}.avatar{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:#ffffff0d;font-weight:900}.info{flex:1;min-width:0}.info b{display:block}.info small{display:block;color:#91a4bb;margin-top:3px}.tag{font-size:9px;font-weight:900;padding:6px 7px;border-radius:999px;background:#ffffff0d}.owner{color:#fde68a;background:#f59e0b18}.admin{color:#c4b5fd;background:#7c3aed22}.active{color:#6ee7b7;background:#10b98118}.blocked{color:#fca5a5;background:#ef444418}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:11px;padding:9px 10px;background:#2563eb;color:white;font-weight:800;font-size:11px}.btn.alt{background:#ffffff10}.btn.danger{background:#7f1d1d}.back{width:100%;margin-top:22px;border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:13px;background:#101d30;color:#eef5ff;font-weight:850}</style></head><body><main class="app"><div class="head"><div><div class="ey">Administración</div><h1>Equipo & Accesos</h1></div><div class="shield">🛡️</div></div><div class="stats"><div class="stat"><b id="a">—</b><span>Activos</span></div><div class="stat"><b id="ad">—</b><span>Admins</span></div><div class="stat"><b id="p">—</b><span>Pendientes</span></div><div class="stat"><b id="bl">—</b><span>Bloqueados</span></div></div><div id="state" class="state">Iniciando…</div><div id="content" hidden><section class="section"><h2>Solicitudes pendientes</h2><div id="pending"></div></section><section class="section"><h2>Equipo activo</h2><div id="active"></div></section><section class="section"><h2>Bloqueados</h2><div id="blocked"></div></section><button id="back" class="back">← Volver al inicio</button></div></main><script>
var state=document.getElementById('state');window.onerror=function(){state.className='state err';state.textContent='Ha ocurrido un problema inesperado. Cierra esta pantalla y vuelve a abrir ParkingMartin-G desde Telegram.';return true;};var tg=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;var API='https://mvexykcxnpaywkbnoxwu.supabase.co/functions/v1/telegram-modern-action';function friendly(v){return window.PMGFriendlyError?window.PMGFriendlyError(v):String(v||'No se pudo completar la operación. Vuelve a intentarlo.');}function setState(text,isErr){state.hidden=false;state.className=isErr?'state err':'state';state.textContent=isErr?friendly(text):text;}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){var m={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};return m[c];});}function nameOf(x){var n=((x.first_name||'')+' '+(x.last_name||'')).trim();if(n)return n;if(x.username)return '@'+x.username;return 'Usuario '+x.telegram_user_id;}function initials(x){var n=nameOf(x).replace('@','').split(/\s+/);return ((n[0]||'?').charAt(0)+(n[1]||'').charAt(0)).toUpperCase();}function roleLabel(role){return role==='owner'?'Root':role==='admin'?'Admin':'Operario';}
function userCard(x,isBlocked,me){var role=x.role||'operario';var tag=isBlocked?'BLOQUEADO':role==='owner'?'ROOT':role==='admin'?'ADMIN':'ACTIVO';var cls=isBlocked?'blocked':role==='owner'?'owner':role==='admin'?'admin':'active';var actions='';if(role!=='owner'&&Number(x.telegram_user_id)!==me){if(isBlocked){actions='<div class="actions"><button class="btn" data-op="reactivate" data-id="'+x.telegram_user_id+'">♻ Reactivar</button></div>';}else{actions='<div class="actions">'+(role==='admin'?'<button class="btn alt" data-op="demote" data-id="'+x.telegram_user_id+'">👤 Quitar admin</button>':'<button class="btn alt" data-op="promote" data-id="'+x.telegram_user_id+'">🛡 Hacer admin</button>')+'<button class="btn danger" data-op="deactivate" data-id="'+x.telegram_user_id+'">⛔ Dar de baja</button></div>';}}return '<div class="card"><div class="row"><div class="avatar">'+esc(initials(x))+'</div><div class="info"><b>'+esc(nameOf(x))+'</b><small>'+esc(roleLabel(role))+'</small></div><span class="tag '+cls+'">'+tag+'</span></div>'+actions+'</div>';}
async function callApi(action,extra){if(!tg||!tg.initData)throw new Error('missing_user');var body={initData:tg.initData,action:action};if(extra){for(var k in extra)body[k]=extra[k];}var r;try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});}catch(e){throw new Error('network_error');}var text=await r.text();var d;try{d=JSON.parse(text);}catch(e){throw new Error('No se pudo interpretar la respuesta del sistema. Actualiza la pantalla y vuelve a intentarlo.');}if(!r.ok||!d.ok)throw new Error(d.error||('HTTP '+r.status));return d;}function render(d){var me=Number(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user?tg.initDataUnsafe.user.id:0);document.getElementById('a').textContent=d.stats.active;document.getElementById('ad').textContent=d.stats.admins;document.getElementById('p').textContent=d.stats.pending;document.getElementById('bl').textContent=d.stats.blocked;var pending=document.getElementById('pending');pending.innerHTML=d.pending.length?d.pending.map(function(x){return '<div class="card"><div class="row"><div class="avatar">'+esc(initials(x))+'</div><div class="info"><b>'+esc(nameOf(x))+'</b><small>Solicitud pendiente</small></div></div><div class="actions"><button class="btn" data-op="approve" data-id="'+x.telegram_user_id+'">✓ Autorizar</button><button class="btn alt" data-op="approve_admin" data-id="'+x.telegram_user_id+'">🛡 Como admin</button><button class="btn danger" data-op="reject" data-id="'+x.telegram_user_id+'">Rechazar</button></div></div>';}).join(''):'<div class="card">No hay solicitudes pendientes.</div>';document.getElementById('active').innerHTML=d.active.length?d.active.map(function(x){return userCard(x,false,me);}).join(''):'<div class="card">No hay usuarios activos.</div>';document.getElementById('blocked').innerHTML=d.blocked.length?d.blocked.map(function(x){return userCard(x,true,me);}).join(''):'<div class="card">No hay usuarios bloqueados.</div>';state.hidden=true;document.getElementById('content').hidden=false;bindActions();}function bindActions(){var buttons=document.querySelectorAll('[data-op]');for(var i=0;i<buttons.length;i++){buttons[i].onclick=async function(){var btn=this;var op=btn.getAttribute('data-op');var id=Number(btn.getAttribute('data-id'));var ok=window.confirm('¿Confirmas esta acción?');if(!ok)return;btn.disabled=true;try{setState('Guardando cambio…',false);var d=await callApi('admin_action',{target_id:id,admin_action:op});render(d);}catch(e){setState(e&&e.message?e.message:e,true);}finally{btn.disabled=false;}};}}async function start(){try{if(tg){tg.ready();tg.expand();try{window.PMGTheme&&window.PMGTheme.apply();}catch(e){}}setState('Conectando con Telegram…',false);if(!tg||!tg.initData)throw new Error('missing_user');setState('Cargando datos reales…',false);var d=await callApi('team_dashboard');render(d);}catch(e){setState(e&&e.message?e.message:e,true);}}document.getElementById('back').onclick=function(){location.href='./?v=20260831PROD2';};start();
</script></body></html>
