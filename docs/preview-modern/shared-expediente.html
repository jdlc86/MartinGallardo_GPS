<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=1"><link rel="stylesheet" href="theme.css?v=9" data-pmg-theme><script src="theme.js?v=8" data-pmg-theme></script><script src="ux-errors.js?v=9"></script><title>Expediente compartido · ParkingMartin-G</title><style>:root{--bg:var(--pmg-bg);--card:var(--pmg-surface);--text:var(--pmg-text);--muted:var(--pmg-muted);--line:var(--pmg-border);--blue:var(--pmg-accent)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}.app{max-width:720px;margin:auto;padding:22px 16px 40px}.ey{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7dd3fc;font-weight:900}h1{margin:4px 0 0;font-size:28px}.notice,.card{margin-top:14px;border:1px solid var(--line);border-radius:20px;background:var(--card)}.notice{padding:13px 15px;color:var(--muted);font-size:12px}.card{padding:16px}.plate{font-size:32px;font-weight:950}.row{display:flex;justify-content:space-between;gap:12px}.pill{font-size:10px;font-weight:900;padding:7px 9px;border-radius:999px;background:#ffffff0d;height:max-content}.parked{color:#6ee7b7;background:#10b98118}.moving{color:#fbbf24;background:#f59e0b18}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.mini{padding:12px;border-radius:15px;background:#ffffff08}.mini span{display:block;font-size:10px;color:var(--muted)}.mini b{display:block;margin-top:4px;font-size:13px}.section h2{font-size:16px;margin:0 0 10px}.group{margin-top:18px}.groupHead{display:flex;justify-content:space-between;gap:10px;align-items:end;margin-bottom:9px}.groupHead b{font-size:14px}.groupHead span{font-size:11px;color:var(--muted)}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.media{overflow:hidden;border-radius:16px;background:#ffffff08;border:1px solid var(--line)}.thumb{position:relative;background:#0a1424}.thumb img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.broken{aspect-ratio:4/3;display:none;place-items:center;color:var(--muted);text-align:center;font-size:12px}.type{position:absolute;left:8px;top:8px;background:#08111fcc;border-radius:999px;padding:5px 7px;font-size:9px;font-weight:900}.meta{padding:10px}.meta b{display:block;font-size:12px}.meta span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.event,.verify{padding:11px 0;border-bottom:1px solid var(--line)}.event:last-child,.verify:last-child{border-bottom:0}.event b,.verify b{font-size:13px}.event div,.verify div{font-size:11px;color:var(--muted);margin-top:3px}.state{text-align:center;color:var(--muted);padding:28px}.modal{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.on{display:flex}.modal img{max-width:100%;max-height:86vh;border-radius:16px}@media(max-width:380px){.grid,.gallery{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="ey">ParkingMartin-G · Solo lectura</div><h1>Expediente compartido</h1><div id="state" class="card state">Validando enlace seguro…</div><div id="content" hidden><div class="notice">🔒 Enlace temporal de solo lectura. No permite realizar operaciones ni modificar datos. Caduca: <b id="expires"></b>.</div><section id="summary" class="card"></section><section id="location" class="card section"></section><section class="card section"><h2>📷 Evidencias</h2><div id="gallery"></div></section><section class="card section"><h2>🔎 OCR matrícula</h2><div id="ocr"></div></section><section class="card section"><h2>📜 Historial</h2><div id="events"></div></section></div></main><div id="modal" class="modal"><img id="big"></div><script>const API='https://mvexykcxnpaywkbnoxwu.supabase.co/functions/v1/vehicle-share-api',$=id=>document.getElementById(id),token=new URLSearchParams(location.search).get('t')||'';function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dt(d){return d?new Date(d):null}function fmt(d){return d?dt(d).toLocaleString('es-ES',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—'}function day(d){return d?dt(d).toLocaleDateString('es-ES',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}):'Sin fecha'}function time(d){return d?dt(d).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):'—'}const stage={airport_pickup:'Aeropuerto · Recogida',parking:'Parking · Aparcado',parking_exit:'Parking · Salida',airport_delivery:'Aeropuerto · Entrega'},evname={state_photo:'Estado del vehículo',plate_photo:'Matrícula',documentation:'Documentación',location_photo:'Ubicación',delivery_photo:'Entrega'};function isImage(e){const m=String(e.mime_type||'').toLowerCase(),t=String(e.media_type||'').toLowerCase(),p=String(e.storage_path||'').toLowerCase();return t==='photo'||t==='image'||m.startsWith('image/')||/\.(jpg|jpeg|png|webp|heic|heif)$/.test(p)}function groups(items){const m=new Map();for(const e of items){const k=day(e.created_at)+'||'+(stage[e.stage]||e.stage||'Sin etapa');if(!m.has(k))m.set(k,[]);m.get(k).push(e)}return[...m.entries()]}function fail(t){$('state').textContent='⚠️ '+t}async function load(){if(token.length<20){fail('Enlace no válido.');return}try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'fetch',token})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error==='expired'?'Este enlace ha caducado.':d.error||'No se pudo abrir');render(d)}catch(e){fail(e.message||e)}}function render(d){$('state').hidden=true;$('content').hidden=false;$('expires').textContent=fmt(d.expires_at);const v=d.vehicle,s=v.status==='parked'?['APARCADO','parked']:(v.status==='requested'||v.status==='in_transit'?['EN MOVIMIENTO','moving']:[String(v.status||'—').toUpperCase(),'']);$('summary').innerHTML=`<div class="row"><div><div class="ey">Vehículo</div><div class="plate">${esc(v.plate)}</div></div><span class="pill ${s[1]}">${s[0]}</span></div><div class="grid"><div class="mini"><span>Aparcado</span><b>${fmt(v.parked_at)}</b></div><div class="mini"><span>Último cambio</span><b>${fmt(v.updated_at)}</b></div></div>`;let loc='<h2>📍 Ubicación registrada</h2>';if(v.current_lat!=null&&v.current_lng!=null)loc+=`<div class="grid"><div class="mini"><span>Precisión</span><b>${v.current_accuracy_m==null?'—':'±'+Math.round(v.current_accuracy_m)+' m'}</b></div><div class="mini"><span>Referencia</span><b>${esc(v.current_location_text||'GPS registrado')}</b></div></div>`;else loc+='<div class="muted">Sin ubicación registrada.</div>';$('location').innerHTML=loc;const evidence=(d.evidence||[]).slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));$('gallery').innerHTML=groups(evidence).map(([k,items])=>{const p=k.split('||');return `<div class="group"><div class="groupHead"><b>${esc(p[1])}</b><span>${esc(p[0])}</span></div><div class="gallery">${items.map(e=>{const img=isImage(e)&&e.signed_url,who=e.uploaded_by_worker?.full_name||'Operario';return `<div class="media"><div class="thumb">${img?`<img src="${esc(e.signed_url)}" data-img="${esc(e.signed_url)}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">`:''}<div class="broken" style="${img?'':'display:grid'}">📷<br>Imagen no disponible</div><div class="type">${esc(evname[e.evidence_type]||e.evidence_type||'Evidencia')}</div></div><div class="meta"><b>${time(e.created_at)} · ${esc(who)}</b><span>${esc(stage[e.stage]||e.stage||'')}</span></div></div>`}).join('')}</div></div>`}).join('')||'<div class="muted">Sin evidencias.</div>';$('ocr').innerHTML=(d.verifications||[]).map(x=>`<div class="verify"><b>${esc(x.result==='matched'?'✅ Verificada':x.result==='overridden'?'⚠️ Ignorada':x.result==='mismatch'?'⚠️ No coincide':'OCR')}</b><div>Esperada: ${esc(x.expected_plate||'—')} · Detectada: ${esc(x.detected_plate||'—')} · ${fmt(x.created_at)}</div></div>`).join('')||'<div class="muted">Sin verificaciones OCR.</div>';const ops={lookup:'Consulta',park:'Aparcado',pickup:'Recogida',retrieve:'Entrega',plate_verification_override:'OCR ignorado'};$('events').innerHTML=(d.events||[]).map(e=>`<div class="event"><b>${esc(ops[e.operation]||e.operation||'Evento')}</b><div>${fmt(e.created_at)} · ${esc(e.worker?.full_name||'Operario')}${e.location_text?' · '+esc(e.location_text):''}</div></div>`).join('')||'<div class="muted">Sin historial.</div>';document.querySelectorAll('[data-img]').forEach(i=>i.onclick=()=>{$('big').src=i.dataset.img;$('modal').classList.add('on')})}$('modal').onclick=()=>$('modal').classList.remove('on');load();</script></body></html>
