<svg xmlns="http://www.w3.org/2000/svg" width="700" height="471" viewBox="0 0 700 471" role="img" aria-labelledby="title desc">
  <title id="title">Guía de ocho fotografías exteriores del vehículo</title>
  <desc id="desc">Ocho tarjetas indican desde dónde fotografiar el vehículo: frontal, diagonales, laterales y trasera.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0d1c31"/>
    </linearGradient>
    <linearGradient id="vehicleBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#a9bdd5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#020617" flood-opacity=".42"/>
    </filter>
    <g id="vehicle">
      <rect x="-25" y="-40" width="50" height="80" rx="19" fill="url(#vehicleBody)" stroke="#d9e8f7" stroke-width="2"/>
      <path d="M-18-18Q0-29 18-18L16-4H-16Z" fill="#17314e" stroke="#6b8cac" stroke-width="1.5"/>
      <path d="M-16 8H16L18 22Q0 31-18 22Z" fill="#17314e" stroke="#6b8cac" stroke-width="1.5"/>
      <path d="M-20-36H-9V-31H-20ZM9-36H20V-31H9Z" fill="#7dd3fc"/>
      <path d="M-20 31H-10V36H-20ZM10 31H20V36H10Z" fill="#fb7185"/>
      <rect x="-29" y="-24" width="6" height="17" rx="3" fill="#020617"/>
      <rect x="23" y="-24" width="6" height="17" rx="3" fill="#020617"/>
      <rect x="-29" y="9" width="6" height="17" rx="3" fill="#020617"/>
      <rect x="23" y="9" width="6" height="17" rx="3" fill="#020617"/>
    </g>
    <g id="camera">
      <circle r="13" fill="url(#accent)" stroke="#93e4ff" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="-7" y="-4.5" width="14" height="10" rx="2.5" fill="#eff8ff"/>
      <circle r="3.1" fill="#1d4ed8"/>
      <path d="M-4-7H3L5-4H-6Z" fill="#eff8ff"/>
    </g>
    <style>
      .card{fill:#122239;stroke:#29415f;stroke-width:1.5}
      .number{fill:#193c76}
      .numberText{font:800 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#9edfff;text-anchor:middle}
      .label{font:800 17px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f3f8ff;letter-spacing:.2px}
      .hint{font:500 11px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#8ea5be}
      .sight{stroke:#38bdf8;stroke-width:2;stroke-dasharray:4 4;opacity:.72}
    </style>
  </defs>

  <rect width="700" height="471" rx="26" fill="url(#background)"/>
  <circle cx="614" cy="-10" r="132" fill="#2563eb" opacity=".11"/>
  <circle cx="70" cy="465" r="112" fill="#0ea5e9" opacity=".07"/>
  <text x="24" y="31" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="850" fill="#f3f8ff">8 FOTOS EXTERIORES</text>
  <text x="676" y="31" text-anchor="end" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#8ea5be">Sigue el orden alrededor del vehículo</text>

  <g transform="translate(12 54)">
    <rect class="card" width="330" height="94" rx="17"/>
    <line class="sight" x1="78" y1="15" x2="78" y2="34"/>
    <g transform="translate(78 50) scale(.55)"><use href="#vehicle"/></g>
    <g transform="translate(78 15)"><use href="#camera"/></g>
    <circle class="number" cx="142" cy="33" r="14"/><text class="numberText" x="142" y="37">01</text>
    <text class="label" x="164" y="38">FRONTAL</text>
    <text class="hint" x="142" y="62">Vehículo centrado y completo</text>
  </g>

  <g transform="translate(358 54)">
    <rect class="card" width="330" height="94" rx="17"/>
    <line class="sight" x1="105" y1="22" x2="88" y2="38"/>
    <g transform="translate(78 50) scale(.55)"><use href="#vehicle"/></g>
    <g transform="translate(106 20)"><use href="#camera"/></g>
    <circle class="number" cx="142" cy="33" r="14"/><text class="numberText" x="142" y="37">02</text>
    <text class="label" x="164" y="38">DEL. DERECHA</text>
    <text class="hint" x="142" y="62">Diagonal de tres cuartos</text>
  </g>

  <g transform="translate(12 155)">
    <rect class="card" width="330" height="94" rx="17"/>
    <line class="sight" x1="121" y1="50" x2="96" y2="50"/>
    <g transform="translate(78 50) scale(.55)"><use href="#vehicle"/></g>
    <g transform="translate(121 50)"><use href="#camera"/></g>
    <circle class="number" cx="142" cy="33" r="14"/><text class="numberText" x="142" y="37">03</text>
    <text class="label" x="164" y="38">LATERAL DERECHA</text>
    <text class="hint" x="142" y="62">Todo el costado visible</text>
  </g>

  <g transform="translate(358 155)">
    <rect class="card" width="330" height="94" rx="17"/>
    <line class="sight" x1="105" y1="78" x2="88" y2="62"/>
    <g transform="translate(78 50) scale(.55)"><use href="#vehicle"/></g>
    <g transform="translate(106 80)"><use href="#camera"/></g>
    <circle class="number" cx="142" cy="33" r="14"/><text class="numberText" x="142" y="37">04</text>
    <text class="label" x="164" y="38">TRAS. DERECHA</text>
    <text class="hint" x="142" y="62">Diagonal de tres cuartos</text>
  </g>

  <g transform="translate(12 256)">
    <rect class="card" width="330" height="94" rx="17"/>
    <line class="sight" x1="78" y1="79" x2="78" y2="65"/>
    <g transform="translate(78 50) scale(.55)"><use href="#vehicle"/></g>
    <g transform="translate(78 80)"><use href="#camera"/></g>
    <circle class="number" cx="142" cy="33" r="14"/><text class="numberText" x="142" y="37">05</text>
    <text class="label" x="164" y="38">TRASERA</text>
    <text class="hint" x="142" y="62">Vehículo centrado y completo</text>
  </g>

  <g transform="translate(358 256)">
    <rect class="card" width="330" height="94" rx="17"/>
    <line class="sight" x1="50" y1="78" x2="68" y2="62"/>
    <g transform="translate(78 50) scale(.55)"><use href="#vehicle"/></g>
    <g transform="translate(50 80)"><use href="#camera"/></g>
    <circle class="number" cx="142" cy="33" r="14"/><text class="numberText" x="142" y="37">06</text>
    <text class="label" x="164" y="38">TRAS. IZQUIERDA</text>
    <text class="hint" x="142" y="62">Diagonal de tres cuartos</text>
  </g>

  <g transform="translate(12 357)">
    <rect class="card" width="330" height="94" rx="17"/>
    <line class="sight" x1="35" y1="50" x2="59" y2="50"/>
    <g transform="translate(78 50) scale(.55)"><use href="#vehicle"/></g>
    <g transform="translate(35 50)"><use href="#camera"/></g>
    <circle class="number" cx="142" cy="33" r="14"/><text class="numberText" x="142" y="37">07</text>
    <text class="label" x="164" y="38">LATERAL IZQUIERDA</text>
    <text class="hint" x="142" y="62">Todo el costado visible</text>
  </g>

  <g transform="translate(358 357)">
    <rect class="card" width="330" height="94" rx="17"/>
    <line class="sight" x1="50" y1="22" x2="68" y2="38"/>
    <g transform="translate(78 50) scale(.55)"><use href="#vehicle"/></g>
    <g transform="translate(50 20)"><use href="#camera"/></g>
    <circle class="number" cx="142" cy="33" r="14"/><text class="numberText" x="142" y="37">08</text>
    <text class="label" x="164" y="38">DEL. IZQUIERDA</text>
    <text class="hint" x="142" y="62">Cierra la vuelta al vehículo</text>
  </g>
</svg>
