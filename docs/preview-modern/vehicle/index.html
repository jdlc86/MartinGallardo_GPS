 srgb,var(--accent) 60%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 12%,transparent)}.go{height:50px;padding:0 18px;border:0;border-radius:16px;background:var(--accent);color:var(--accentText);font:inherit;font-weight:850}.statusBox{text-align:center;padding:30px 18px;color:var(--muted)}.hero{position:relative;overflow:hidden;padding:19px}.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-90px;top:-90px;background:color-mix(in srgb,var(--accent) 12%,transparent)}.heroTop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:relative;z-index:1}.plate{font-size:31px;font-weight:950;letter-spacing:-.045em}.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:850;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}.pill.parked{background:color-mix(in srgb,var(--good) 13%,transparent);color:var(--good)}.pill.retrieved{background:color-mix(in srgb,var(--muted) 12%,transparent);color:var(--muted)}.pill.in_transit,.pill.requested{background:color-mix(in srgb,var(--warn) 13%,transparent);color:var(--warn)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px;position:relative;z-index:1}.stat{padding:13px;border-radius:17px;background:color-mix(in srgb,var(--text) 4%,transparent)}.stat span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:800}.stat b{display:block;margin-top:4px;font-size:14px}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.sectionHead h2{font-size:18px;letter-spacing:-.02em;margin:0}.count{font-size:11px;color:var(--muted);font-weight:750}.locationGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.locItem{padding:12px 13px;border-radius:16px;background:color-mix(in srgb,var(--text) 4%,transparent)}.locItem span{display:block;font-size:11px;color:var(--muted);font-weight:750}.locItem b{display:block;margin-top:4px;font-size:14px}.nav{width:100%;margin-top:12px;border:0;border-radius:16px;padding:14px 16px;background:var(--accent);color:var(--accentText);font:inherit;font-weight:850}.note{margin-top:12px;padding:12px 13px;border-radius:15px;background:color-mix(in srgb,var(--warn) 10%,transparent);color:var(--muted);font-size:13px;line-height:1.4}.dayGroup{margin-top:18px}.dayTitle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:850;color:var(--muted);margin-bottom:10px}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.media{overflow:hidden;border-radius:18px;border:1px solid var(--line);background:color-mix(in srgb,var(--text) 3%,transparent)}.thumb{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:color-mix(in srgb,var(--text) 5%,transparent)}.doc{aspect-ratio:4/3;display:grid;place-items:center;font-size:34px}.meta{padding:10px 11px}.meta b{display:block;font-size:13px}.meta span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.timeline{position:relative;margin-left:8px}.event{position:relative;padding:0 0 18px 24px}.event:before{content:"";position:absolute;left:2px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 12%,transparent)}.event:after{content:"";position:absolute;left:6px;top:18px;bottom:0;width:1px;background:var(--line)}.event:last-child:after{display:none}.event b{font-size:14px}.event p{margin:4px 0 0;color:var(--muted);font-size:12px;line-height:1.35}.verify{padding:12px 13px;border-radius:16px;background:color-mix(in srgb,var(--text) 4%,transparent);margin:8px 0}.verify strong{display:block;font-size:13px}.verify span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.another{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--surface);color:var(--text);font:inherit;font-weight:850}.empty{color:var(--muted);font-size:13px;padding:8px 0}.footer{text-align:center;color:var(--muted);font-size:10px;margin:16px 0}.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modal img{max-width:100%;max-height:82vh;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.4)}.close{position:absolute;right:18px;top:max(18px,var(--tg-safe-area-inset-top,18px));width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:white;font-size:20px}@media(max-width:520px){.gallery{grid-template-columns:1fr 1fr}.stats,.locationGrid{grid-template-columns:1fr 1fr}}@media(max-width:360px){.gallery{grid-template-columns:1fr}.search{flex-direction:column}.go{width:100%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><main class="app"><header class="top"><div class="brand"><div class="logo">🚘</div><div><div class="eyebrow">ParkingMartin-G</div><h1 id="title">Expediente 360º</h1></div></div></header><section id="search" class="card search"><div class="inputWrap"><span>🔎</span><input id="plate" class="input" placeholder="Matrícula" autocomplete="off" autocapitalize="characters"></div><button id="go" class="go">Buscar</button></section><section id="status" class="card statusBox" hidden></section><div id="content" hidden><section class="card hero" id="summary"></section><section class="card" id="location"></section><section class="card"><div class="sectionHead"><h2>📷 Evidencias</h2><span class="count" id="evidenceCount"></span></div><div id="gallery"></div></section><section class="card"><div class="sectionHead"><h2>🔎 Matrícula</h2><span class="count">OCR</span></div><div id="ocr"></div></section><section class="card"><div class="sectionHead"><h2>📜 Historial</h2><span class="count">Más reciente primero</span></div><div class="timeline" id="events"></div></section><button id="another" class="another">Consultar otro vehículo</button></div><div class="footer">Expediente seguro · enlaces de evidencia temporales</div></main><div class="modal" id="modal"><button class="close" id="closeModal">×</button><img id="modalImg" alt="Evidencia ampliada"></div><script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('secondary_bg_color');tg.setBackgroundColor('bg_color')}catch{}}const API='https://mvexykcxnpaywkbnoxwu.supabase.co/functions/v1/vehicle-consult-api';const $=id=>document.getElementById(id),input=$('plate'),go=$('go'),search=$('search'),status=$('status'),content=$('content'),modal=$('modal'),modalImg=$('modalImg');const initial=(new URLSearchParams(location.search).get('plate')||'').toUpperCase();if(initial)input.value=initial;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));const dt=d=>d?new Date(d):null;const fmt=d=>d?dt(d).toLocaleString('es-ES',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';const time=d=>d?dt(d).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):'—';const day=d=>d?dt(d).toLocaleDateString('es-ES',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}):'Sin fecha';const statusName={parked:'APARCADO',requested:'SOLICITADO',in_transit:'EN TRÁNSITO',retrieved:'ENTREGADO'};const stageName={airport_pickup:'Aeropuerto · Recogida',parking:'Parking · Aparcado',parking_exit:'Parking · Salida',airport_delivery:'Aeropuerto · Entrega'};const evidenceName={state_photo:'Foto del estado',plate_photo:'Foto de matrícula',documentation:'Documentación',location_photo:'Foto de ubicación',delivery_photo:'Foto de entrega'};const opName={lookup:'Consulta del vehículo',park:'Vehículo aparcado',pickup:'Recogida en aeropuerto',retrieve:'Entrega al cliente',plate_verification_override:'Verificación OCR ignorada'};const verifyName={matched:'✅ Matrícula verificada',mismatch:'⚠️ No coincide',ocr_failed:'⚠️ No se pudo leer',overridden:'⚠️ Ignorada por operario'};const haptic=(type='selection')=>{try{if(['success','error','warning'].includes(type))tg?.HapticFeedback?.notificationOccurred(type);else tg?.HapticFeedback?.selectionChanged()}catch{}};function backToSearch(){content.hidden=true;search.hidden=false;$('title').textContent='Expediente 360º';input.value='';input.focus();try{tg?.BackButton?.hide()}catch{}}function setupBack(){if(!tg)return;try{tg.BackButton.show();tg.BackButton.offClick(backToSearch);tg.BackButton.onClick(backToSearch)}catch{}}async function load(){const plate=input.value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(plate.length<4){showError('Introduce una matrícula válida.');haptic('warning');return}if(!tg||!tg.initData){showError('Esta pantalla debe abrirse desde Telegram.');return}go.disabled=true;status.hidden=false;status.innerHTML='Buscando <b>'+esc(plate)+'</b>…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData,plate})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error==='not_found'?'Vehículo no encontrado':d.error||'No se pudo cargar');haptic('success');render(d)}catch(e){showError(e.message||e);haptic('error')}finally{go.disabled=false}}function showError(t){status.hidden=false;status.innerHTML='⚠️ '+esc(t)}function render(d){const v=d.vehicle;search.hidden=true;status.hidden=true;content.hidden=false;$('title').textContent=v.plate;setupBack();const st=statusName[v.status]||v.status;$('summary').innerHTML='<div class="heroTop"><div><div class="eyebrow">Vehículo</div><div class="plate">'+esc(v.plate)+'</div></div><div class="pill '+esc(v.status)+'">● '+esc(st)+'</div></div><div class="stats"><div class="stat"><span>Aparcado</span><b>'+fmt(v.parked_at)+'</b></div><div class="stat"><span>Último cambio</span><b>'+fmt(v.updated_at)+'</b></div></div>';let loc='<div class="sectionHead"><h2>📍 Ubicación</h2><span class="count">'+(v.status==='parked'?'Actual':'Histórica')+'</span></div>';if(v.current_lat!=null&&v.current_lng!=null){const map='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(v.current_lat+','+v.current_lng)+'&travelmode=walking&dir_action=navigate';loc+='<div class="locationGrid"><div class="locItem"><span>Precisión GPS</span><b>'+(v.current_accuracy_m==null?'No informada':'±'+Math.round(v.current_accuracy_m)+' m')+'</b></div><div class="locItem"><span>Coordenadas</span><b>'+Number(v.current_lat).toFixed(5)+', '+Number(v.current_lng).toFixed(5)+'</b></div></div>';if(v.current_location_text)loc+='<div class="locItem" style="margin-top:10px"><span>Referencia</span><b>'+esc(v.current_location_text)+'</b></div>';if(v.status==='parked')loc+='<button class="nav" data-map="'+esc(map)+'">🧭 Navegar hasta el coche</button>';else loc+='<div class="note">Esta es la última ubicación registrada. El vehículo ya no figura como aparcado, por eso no se ofrece navegación.</div>'}else loc+='<div class="empty">No hay ubicación registrada.</div>';$('location').innerHTML=loc;const nav=$('location').querySelector('[data-map]');if(nav)nav.onclick=()=>{haptic();const url=nav.dataset.map;try{tg?.openLink?tg.openLink(url,{try_instant_view:false}):window.open(url,'_blank')}catch{window.open(url,'_blank')}};renderEvidence(d.evidence||[]);$('ocr').innerHTML=d.verifications.length?d.verifications.map(x=>'<div class="verify"><strong>'+esc(verifyName[x.result]||x.result)+'</strong><span>'+esc(stageName[x.stage]||x.stage)+' · '+fmt(x.created_at)+(x.worker?' · '+esc(x.worker.full_name):'')+'</span><span>Esperada <b>'+esc(x.expected_plate)+'</b> · Detectada <b>'+esc(x.detected_plate||'No leída')+'</b></span></div>').join(''):'<div class="empty">Sin verificaciones registradas.</div>';$('events').innerHTML=d.events.length?d.events.map(e=>'<div class="event"><b>'+esc(opName[e.operation]||e.operation)+'</b><p>'+(e.location_text?esc(e.location_text)+'<br>':'')+fmt(e.created_at)+(e.worker?' · '+esc(e.worker.full_name):'')+'</p></div>').join(''):'<div class="empty">Sin historial.</div>'}function renderEvidence(items){items=[...items].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));$('evidenceCount').textContent=items.length+' archivo'+(items.length===1?'':'s');const groups=new Map();for(const e of items){const key=day(e.created_at)+'|'+(stageName[e.stage]||e.stage||'Sin etapa');if(!groups.has(key))groups.set(key,[]);groups.get(key).push(e)}let html='';for(const[key,arr]of groups){const[fecha,etapa]=key.split('|');html+='<div class="dayGroup"><div class="dayTitle">'+esc(fecha)+' · '+esc(etapa)+'</div><div class="gallery">';for(const e of arr){const who=e.uploaded_by_worker?.full_name||'Operario no identificado',label=evidenceName[e.evidence_type]||e.evidence_type,meta='<div class="meta"><b>'+esc(label)+'</b><span>'+esc(time(e.created_at))+' · '+esc(who)+'</span></div>';if(e.media_type==='photo'&&e.signed_url)html+='<div class="media"><img class="thumb evidence-img" src="'+esc(e.signed_url)+'" data-src="'+esc(e.signed_url)+'" alt="'+esc(label)+'">'+meta+'</div>';else if(e.signed_url)html+='<div class="media evidence-doc" data-src="'+esc(e.signed_url)+'"><div class="doc">📄</div>'+meta+'</div>';else html+='<div class="media"><div class="doc">⚠️</div>'+meta+'</div>'}html+='</div></div>'}$('gallery').innerHTML=html||'<div class="empty">Sin fotos ni documentación.</div>';$('gallery').querySelectorAll('.evidence-img').forEach(el=>el.onclick=()=>{haptic();modalImg.src=el.dataset.src;modal.classList.add('open')});$('gallery').querySelectorAll('.evidence-doc').forEach(el=>el.onclick=()=>{haptic();const u=el.dataset.src;try{tg?.openLink?tg.openLink(u):window.open(u,'_blank')}catch{window.open(u,'_blank')}})}go.onclick=load;input.addEventListener('keydown',e=>{if(e.key==='Enter')load()});$('another').onclick=backToSearch;$('closeModal').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};if(initial)load();
</script></body></html>
