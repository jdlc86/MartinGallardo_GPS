</style></head><body><main class="app"><header class="top"><div class="brand"><div class="logo">🚘</div><div><div class="eyebrow">ParkingMartin-G</div><h1 id="title">Expediente 360º</h1></div></div></header><section id="search" class="card search"><div class="inputWrap"><span>🔎</span><input id="plate" class="input" placeholder="Matrícula" autocomplete="off" autocapitalize="characters"></div><button id="go" class="go">Buscar</button></section><section id="status" class="card statusBox" hidden></section><div id="content" hidden><section class="card hero" id="summary"></section><section class="card" id="stays"></section><section class="card" id="dispute"></section><section class="card" id="location"></section><section class="card"><div class="sectionHead"><h2>📷 Evidencias</h2><span class="count" id="evidenceCount"></span></div><div id="gallery"></div></section><section class="card"><div class="sectionHead"><h2>🔎 Matrícula</h2><span class="count">OCR</span></div><div id="ocr"></div></section><section class="card"><div class="sectionHead"><h2>📜 Historial</h2><span class="count">Más reciente primero</span></div><div class="timeline" id="events"></div></section><button id="another" class="another">Consultar otro vehículo</button></div><div class="footer">Expediente seguro · evidencias separadas por estancia</div></main><div class="modal" id="modal"><button class="close" id="closeModal">×</button><img id="modalImg" alt="Evidencia ampliada"></div><script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('secondary_bg_color');tg.setBackgroundColor('bg_color')}catch{}}const API='https://mvexykcxnpaywkbnoxwu.supabase.co/functions/v1/vehicle-consult-api';const $=id=>document.getElementById(id),input=$('plate'),go=$('go'),search=$('search'),status=$('status'),content=$('content'),modal=$('modal'),modalImg=$('modalImg');let current=null;const initial=(new URLSearchParams(location.search).get('plate')||'').toUpperCase();if(initial)input.value=initial;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));const dt=d=>d?new Date(d):null;const fmt=d=>d?dt(d).toLocaleString('es-ES',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';const time=d=>d?dt(d).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):'—';const day=d=>d?dt(d).toLocaleDateString('es-ES',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}):'Sin fecha';const statusName={parked:'APARCADO',requested:'SOLICITADO',in_transit:'EN TRÁNSITO',retrieved:'ENTREGADO'};const stageName={airport_pickup:'Aeropuerto · Recogida',parking:'Parking · Aparcado',parking_exit:'Parking · Salida',airport_delivery:'Aeropuerto · Entrega',Reubicación:'Reubicación'};const evidenceName={state_photo:'Foto del estado',plate_photo:'Foto de matrícula',documentation:'Documentación',location_photo:'Foto de ubicación',delivery_photo:'Foto de entrega'};const opName={lookup:'Consulta del vehículo',park:'Vehículo aparcado',pickup:'Recogida en aeropuerto',retrieve:'Entrega al cliente',plate_verification_override:'Verificación OCR ignorada','Vehículo reubicado':'Vehículo reubicado'};const verifyName={matched:'✅ Matrícula verificada',mismatch:'⚠️ No coincide',ocr_failed:'⚠️ No se pudo leer',overridden:'⚠️ Ignorada por operario'};const haptic=(type='selection')=>{try{if(['success','error','warning'].includes(type))tg?.HapticFeedback?.notificationOccurred(type);else tg?.HapticFeedback?.selectionChanged()}catch{}};function backToSearch(){content.hidden=true;search.hidden=false;status.hidden=true;$('title').textContent='Expediente 360º';input.value='';current=null;input.focus();try{tg?.BackButton?.hide()}catch{}}function setupBack(){if(!tg)return;try{tg.BackButton.show();tg.BackButton.offClick(backToSearch);tg.BackButton.onClick(backToSearch)}catch{}}async function api(payload){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg?.initData||'',...payload})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'No se pudo cargar');return d}async function load(stayId=''){const plate=input.value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(plate.length<4){showError('Introduce una matrícula válida.');haptic('warning');return}if(!tg||!tg.initData){showError('Esta pantalla debe abrirse desde Telegram.');return}go.disabled=true;status.hidden=false;status.innerHTML='Buscando <b>'+esc(plate)+'</b>…';try{const d=await api({action:'get',plate,stay_id:stayId});haptic('success');render(d)}catch(e){showError(e.message==='not_found'?'Vehículo no encontrado':e.message||e);haptic('error')}finally{go.disabled=false}}function showError(t){status.hidden=false;status.innerHTML='⚠️ '+esc(t)}function render(d){current=d;const v=d.vehicle,s=d.selected_stay;search.hidden=true;status.hidden=true;content.hidden=false;$('title').textContent=v.plate;setupBack();const historical=s.status!=='active',st=historical?'HISTÓRICO':(statusName[v.status]||v.status);$('summary').innerHTML='<div class="heroTop"><div><div class="eyebrow">Vehículo</div><div class="plate">'+esc(v.plate)+'</div><div class="count">'+esc(s.stay_code)+'</div></div><div class="pill '+(historical?'retrieved':esc(v.status))+'">● '+esc(st)+'</div></div><div class="stats"><div class="stat"><span>Entrada de estancia</span><b>'+fmt(s.started_at)+'</b></div><div class="stat"><span>Entrega</span><b>'+fmt(s.delivered_at)+'</b></div></div>';renderStays(d);renderDispute(d);renderLocation(d);renderEvidence(d.evidence||[],s);$('ocr').innerHTML=d.verifications.length?d.verifications.map(x=>'<div class="verify"><strong>'+esc(verifyName[x.result]||x.result)+'</strong><span>'+esc(stageName[x.stage]||x.stage)+' · '+fmt(x.created_at)+(x.worker?' · '+esc(x.worker.full_name):'')+'</span><span>Esperada <b>'+esc(x.expected_plate)+'</b> · Detectada <b>'+esc(x.detected_plate||'No leída')+'</b></span></div>').join(''):'<div class="empty">Sin verificaciones registradas en esta estancia.</div>';$('events').innerHTML=d.events.length?d.events.map(e=>'<div class="event"><b>'+esc(opName[e.operation]||e.operation)+'</b><p>'+(e.location_text?esc(e.location_text)+'<br>':'')+fmt(e.created_at)+(e.worker?' · '+esc(e.worker.full_name):'')+'</p></div>').join(''):'<div class="empty">Sin historial en esta estancia.</div>'}function renderStays(d){const s=d.selected_stay,arr=d.stays||[];$('stays').innerHTML='<div class="sectionHead"><h2>🗂️ Estancias</h2><span class="count">'+arr.length+'</span></div><div class="stayList">'+arr.map(x=>'<button class="stayBtn '+(x.id===s.id?'active':'')+'" data-stay="'+esc(x.id)+'"><b>'+esc(x.stay_code)+'</b><span>'+(x.status==='active'?'Activa · ':'Histórica · ')+fmt(x.started_at)+(x.delivered_at?' → '+fmt(x.delivered_at):'')+'</span></button>').join('')+'</div>';$('stays').querySelectorAll('[data-stay]').forEach(b=>b.onclick=()=>{haptic();load(b.dataset.stay)})}function renderDispute(d){const box=$('dispute'),open=d.active_dispute;if(open){box.innerHTML='<div class="sectionHead"><h2>⚠️ Disputa</h2><span class="count">RETENCIÓN SUSPENDIDA</span></div><div class="disputeOpen"><b>Expediente en disputa — retención suspendida</b><span>Abierta '+fmt(open.opened_at)+' · '+esc(open.reason)+'</span></div>'+(d.can_manage_dispute?'<div class="form"><textarea id="closeNote" class="textarea" placeholder="Nota de cierre (opcional)"></textarea><button id="closeDispute" class="action secondary" style="width:100%;margin-top:10px">Cerrar disputa</button></div>':'');if(d.can_manage_dispute)$('closeDispute').onclick=closeDispute}else{box.innerHTML='<div class="sectionHead"><h2>🛡️ Retención</h2><span class="count">Sin disputa activa</span></div><div class="empty">Esta estancia sigue la política normal de retención.</div>'+(d.can_manage_dispute?'<button id="openDispute" class="action danger" style="width:100%;margin-top:8px">Abrir disputa / Bloquear eliminación</button><div id="openForm" class="form" hidden><textarea id="reason" class="textarea" placeholder="Motivo de la disputa"></textarea><div class="row"><button id="cancelOpen" class="action secondary">Cancelar</button><button id="confirmOpen" class="action danger">Confirmar</button></div></div>':'');if(d.can_manage_dispute){$('openDispute').onclick=()=>{$('openDispute').hidden=true;$('openForm').hidden=false;$('reason').focus()};$('cancelOpen').onclick=()=>renderDispute(d);$('confirmOpen').onclick=openDispute}}}async function openDispute(){const reason=$('reason').value.trim();if(reason.length<3){haptic('warning');return}try{const d=await api({action:'open_dispute',plate:current.vehicle.plate,stay_id:current.selected_stay.id,reason});haptic('success');render(d)}catch(e){showError(e.message||e);haptic('error')}}async function closeDispute(){const note=$('closeNote')?.value?.trim()||'';try{const d=await api({action:'close_dispute',plate:current.vehicle.plate,stay_id:current.selected_stay.id,close_note:note});haptic('success');render(d)}catch(e){showError(e.message||e);haptic('error')}}function renderLocation(d){const v=d.vehicle,s=d.selected_stay,historical=s.status!=='active';let loc='<div class="sectionHead"><h2>📍 Ubicación</h2><span class="count">'+(historical?'Histórica':'Actual')+'</span></div>';if(v.current_lat!=null&&v.current_lng!=null){loc+='<div class="locationGrid"><div class="locItem"><span>Precisión GPS</span><b>'+(v.current_accuracy_m==null?'No informada':'±'+Math.round(v.current_accuracy_m)+' m')+'</b></div><div class="locItem"><span>Coordenadas</span><b>'+Number(v.current_lat).toFixed(5)+', '+Number(v.current_lng).toFixed(5)+'</b></div></div>';if(v.current_location_text)loc+='<div class="locItem" style="margin-top:10px"><span>Referencia</span><b>'+esc(v.current_location_text)+'</b></div>';if(!historical&&v.status==='parked'){const map='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(v.current_lat+','+v.current_lng)+'&travelmode=walking&dir_action=navigate';loc+='<button class="nav" data-map="'+esc(map)+'">🧭 Navegar hasta el coche</button>'}else loc+='<div class="note">Ubicación asociada a esta estancia histórica. No se ofrece navegación.</div>'}else loc+='<div class="empty">No hay ubicación registrada para esta estancia.</div>';$('location').innerHTML=loc;const nav=$('location').querySelector('[data-map]');if(nav)nav.onclick=()=>{const u=nav.dataset.map;try{tg?.openLink?tg.openLink(u,{try_instant_view:false}):window.open(u,'_blank')}catch{window.open(u,'_blank')}}}function renderEvidence(items,s){items=[...items].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));$('evidenceCount').textContent=items.length+' archivo'+(items.length===1?'':'s');if(!items.length&&s.evidence_purged_at){$('gallery').innerHTML='<div class="note">Evidencias eliminadas por política de retención el '+fmt(s.evidence_purged_at)+'.</div>';return}const groups=new Map();for(const e of items){const key=day(e.created_at)+'|'+(stageName[e.stage]||e.stage||'Sin etapa');if(!groups.has(key))groups.set(key,[]);groups.get(key).push(e)}let html='';for(const[key,arr]of groups){const[fecha,etapa]=key.split('|');html+='<div class="dayGroup"><div class="dayTitle">'+esc(fecha)+' · '+esc(etapa)+'</div><div class="gallery">';for(const e of arr){const who=e.uploaded_by_worker?.full_name||'Operario no identificado',label=evidenceName[e.evidence_type]||e.evidence_type,meta='<div class="meta"><b>'+esc(label)+'</b><span>'+esc(time(e.created_at))+' · '+esc(who)+'</span></div>';if(e.med
