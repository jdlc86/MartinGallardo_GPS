<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><title>Expediente 360º</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>:root{color-scheme:dark;--bg:#08111f;--card:#101d30;--text:#eef5ff;--muted:#91a4bb;--line:#ffffff16;--blue:#2563eb;--good:#10b981}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}.app{max-width:720px;margin:auto;padding:22px 16px 36px}.ey{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7dd3fc;font-weight:900}h1{margin:3px 0;font-size:28px}.card{margin-top:14px;padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line)}.search{display:flex;gap:8px}.search input{flex:1;border:1px solid var(--line);background:#ffffff08;color:#fff;border-radius:14px;padding:13px;font:inherit;text-transform:uppercase}.btn{border:0;border-radius:14px;padding:12px 15px;background:var(--blue);color:#fff;font-weight:850}.share{width:100%;margin-top:10px;background:linear-gradient(135deg,#2563eb,#7c3aed)}.share:disabled{opacity:.55}.plate{font-size:31px;font-weight:950}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.pill{font-size:10px;font-weight:900;padding:7px 9px;border-radius:999px;background:#ffffff0d}.parked{color:#6ee7b7;background:#10b98118}.moving{color:#fbbf24;background:#f59e0b18}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.mini{padding:12px;border-radius:15px;background:#ffffff08}.mini span{display:block;font-size:10px;color:var(--muted)}.mini b{display:block;margin-top:4px;font-size:13px}.section h2{font-size:16px;margin:0 0 10px}.group{margin-top:18px}.group:first-child{margin-top:4px}.groupHead{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:9px}.groupHead b{font-size:14px}.groupHead span{font-size:11px;color:var(--muted)}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.media{overflow:hidden;border-radius:16px;background:#ffffff08;border:1px solid var(--line)}.thumbWrap{position:relative;background:#0a1424}.media img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.broken{aspect-ratio:4/3;display:none;place-items:center;text-align:center;padding:20px;color:var(--muted);font-size:12px}.type{position:absolute;left:8px;top:8px;padding:5px 7px;border-radius:999px;background:#08111fcc;font-size:9px;font-weight:900}.meta{padding:10px}.meta b{display:block;font-size:12px;color:#fff}.meta span{display:block;font-size:11px;color:var(--muted);margin-top:3px}.event,.verify{padding:11px 0;border-bottom:1px solid var(--line)}.event:last-child,.verify:last-child{border-bottom:0}.event b,.verify b{font-size:13px}.event div,.verify div{font-size:11px;color:var(--muted);margin-top:3px}.state{text-align:center;color:var(--muted)}.back{width:100%;margin-top:18px;border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--card);color:#fff;font-weight:850}.modal{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.on{display:flex}.modal img{max-width:100%;max-height:85vh;border-radius:16px}.modal button{position:absolute;right:18px;top:18px;width:42px;height:42px;border:0;border-radius:50%;background:#ffffff20;color:#fff;font-size:22px}@media(max-width:380px){.grid,.gallery{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="ey">ParkingMartin-G</div><h1>Expediente 360º</h1><section class="card search"><input id="plate" placeholder="Matrícula"><button id="go" class="btn">Buscar</button></section><div id="state" class="card state" hidden></div><div id="content" hidden><section id="summary" class="card"></section><button id="share" class="btn share">↗ Compartir expediente · 24 h</button><section id="location" class="card section"></section><section class="card section"><h2>📷 Evidencias fotográficas</h2><div id="gallery"></div></section><section class="card section"><h2>🔎 OCR matrícula</h2><div id="ocr"></div></section><section class="card section"><h2>📜 Historial</h2><div id="events"></div></section></div><button class="back" onclick="location.href='./?v=20260831Q'">← Volver a la App Moderna</button></main><div id="modal" class="modal"><button id="close">×</button><img id="big"></div><script>const tg=window.Telegram?.WebApp,API='https://mvexykcxnpaywkbnoxwu.supabase.co/functions/v1/vehicle-consult-api',SHARE_API='https://mvexykcxnpaywkbnoxwu.supabase.co/functions/v1/vehicle-share-api';if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#08111f');tg.setBackgroundColor('#08111f');tg.setBottomBarColor?.('#08111f')}catch{}}const $=id=>document.getElementById(id),input=$('plate');let currentPlate='';const q=new URLSearchParams(location.search).get('plate');if(q)input.value=q;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dt(d){return d?new Date(d):null}function fmt(d){return d?dt(d).toLocaleString('es-ES',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—'}function day(d){return d?dt(d).toLocaleDateString('es-ES',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}):'Sin fecha'}function time(d){return d?dt(d).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):'—'}function show(t){$('state').hidden=false;$('state').textContent=t}const stage={airport_pickup:'Aeropuerto · Recogida',parking:'Parking · Aparcado',parking_exit:'Parking · Salida',airport_delivery:'Aeropuerto · Entrega'};const evname={state_photo:'Estado del vehículo',plate_photo:'Matrícula',documentation:'Documentación',location_photo:'Ubicación',delivery_photo:'Entrega'};function isImage(e){const mime=String(e.mime_type||'').toLowerCase(),media=String(e.media_type||'').toLowerCase(),path=String(e.storage_path||'').toLowerCase();return media==='photo'||media==='image'||mime.startsWith('image/')||/\.(jpg|jpeg|png|webp|heic|heif)$/.test(path)}function groupedEvidence(items){const map=new Map();for(const e of items){const k=day(e.created_at)+'||'+(stage[e.stage]||e.stage||'Sin etapa');if(!map.has(k))map.set(k,[]);map.get(k).push(e)}return [...map.entries()]}async function load(){const plate=input.value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(plate.length<4){show('Introduce una matrícula válida.');return}if(!tg?.initData){show('Abre esta pantalla desde Telegram.');return}show('Buscando '+plate+'…');try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData,plate})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error==='not_found'?'Vehículo no encontrado':d.error||'Error');render(d)}catch(e){show('⚠️ '+(e.message||e))}}async function shareExpediente(){if(!currentPlate||!tg?.initData)return;const b=$('share'),old=b.textContent;b.disabled=true;b.textContent='Creando enlace seguro…';try{const r=await fetch(SHARE_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'create',initData:tg.initData,plate:currentPlate})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'No se pudo crear el enlace');const text=`Expediente del vehículo ${currentPlate} · enlace de solo lectura válido durante 24 horas.`;try{if(navigator.share){await navigator.share({title:'Expediente '+currentPlate,text,url:d.url});return}}catch(e){if(e?.name==='AbortError')return}const share='https://t.me/share/url?url='+encodeURIComponent(d.url)+'&text='+encodeURIComponent(text);if(tg?.openTelegramLink)tg.openTelegramLink(share);else if(navigator.clipboard){await navigator.clipboard.writeText(d.url);show('Enlace copiado al portapapeles.')}else window.open(share,'_blank')}catch(e){show('⚠️ '+(e.message||e))}finally{b.disabled=false;b.textContent=old}}function render(d){$('state').hidden=true;$('content').hidden=false;const v=d.vehicle;currentPlate=v.plate;const s=v.status==='parked'?['APARCADO','parked']:(v.status==='requested'||v.status==='in_transit'?['EN MOVIMIENTO','moving']:[String(v.status||'—').toUpperCase(),'']);$('summary').innerHTML=`<div class="row"><div><div class="ey">Vehículo</div><div class="plate">${esc(v.plate)}</div></div><span class="pill ${s[1]}">${s[0]}</span></div><div class="grid"><div class="mini"><span>Aparcado</span><b>${fmt(v.parked_at)}</b></div><div class="mini"><span>Último cambio</span><b>${fmt(v.updated_at)}</b></div></div>`;let loc='<h2>📍 Ubicación</h2>';if(v.current_lat!=null&&v.current_lng!=null){loc+=`<div class="grid"><div class="mini"><span>Precisión</span><b>${v.current_accuracy_m==null?'—':'±'+Math.round(v.current_accuracy_m)+' m'}</b></div><div class="mini"><span>Referencia</span><b>${esc(v.current_location_text||'GPS registrado')}</b></div></div>`;if(v.status==='parked'){const u='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(v.current_lat+','+v.current_lng)+'&travelmode=walking';loc+=`<button class="btn" style="width:100%;margin-top:10px" data-map="${esc(u)}">🧭 Navegar hasta el coche</button>`}}else loc+='<div class="muted">Sin ubicación registrada.</div>';$('location').innerHTML=loc;const evidence=(d.evidence||[]).slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));const groups=groupedEvidence(evidence);$('gallery').innerHTML=groups.length?groups.map(([k,items])=>{const parts=k.split('||');return `<div class="group"><div class="groupHead"><b>${esc(parts[1])}</b><span>${esc(parts[0])}</span></div><div class="gallery">${items.map(e=>{const img=isImage(e)&&e.signed_url;const who=e.uploaded_by_worker?.full_name||'Operario';return `<div class="media"><div class="thumbWrap">${img?`<img src="${esc(e.signed_url)}" data-img="${esc(e.signed_url)}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">`:' '}<div class="broken" style="${img?'':'display:grid'}">📷<br>Imagen no disponible</div><div class="type">${esc(evname[e.evidence_type]||e.evidence_type||'Evidencia')}</div></div><div class="meta"><b>${time(e.created_at)} · ${esc(who)}</b><span>${esc(stage[e.stage]||e.stage||'Sin etapa')}</span></div></div>`}).join('')}</div></div>`}).join(''):'<div class="muted">Sin evidencias.</div>';$('ocr').innerHTML=(d.verifications||[]).map(x=>`<div class="verify"><b>${esc(x.result==='matched'?'✅ Verificada':x.result==='overridden'?'⚠️ Ignorada':x.result==='mismatch'?'⚠️ No coincide':'OCR')}</b><div>Esperada: ${esc(x.expected_plate||'—')} · Detectada: ${esc(x.detected_plate||'—')} · ${fmt(x.created_at)}</div></div>`).join('')||'<div class="muted">Sin verificaciones OCR.</div>';const ops={lookup:'Consulta',park:'Aparcado',pickup:'Recogida',retrieve:'Entrega',plate_verification_override:'OCR ignorado'};$('events').innerHTML=(d.events||[]).map(e=>`<div class="event"><b>${esc(ops[e.operation]||e.operation||'Evento')}</b><div>${fmt(e.created_at)} · ${esc(e.worker?.full_name||'Operario')}${e.location_text?' · '+esc(e.location_text):''}</div></div>`).join('')||'<div class="muted">Sin historial.</div>';document.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>tg?.openLink?tg.openLink(b.dataset.map):window.open(b.dataset.map));document.querySelectorAll('[data-img]').forEach(i=>i.onclick=()=>{$('big').src=i.dataset.img;$('modal').classList.add('on')})}$('go').onclick=load;$('share').onclick=shareExpediente;input.addEventListener('keydown',e=>{if(e.key==='Enter')load()});$('close').onclick=()=>$('modal').classList.remove('on');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('on')};if(q)load();</script></body></html>
