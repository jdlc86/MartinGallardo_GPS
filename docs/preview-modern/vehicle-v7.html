<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=1"><link rel="stylesheet" href="theme.css?v=9" data-pmg-theme><script src="theme.js?v=8" data-pmg-theme></script><script src="ux-errors.js?v=5"></script><title>Expediente 360º</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>:root{--bg:var(--pmg-bg);--card:var(--pmg-surface);--text:var(--pmg-text);--muted:var(--pmg-muted);--line:var(--pmg-border);--blue:var(--pmg-accent)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}.app{max-width:720px;margin:auto;padding:22px 16px 36px}.ey{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7dd3fc;font-weight:900}h1{margin:3px 0;font-size:28px}.card{margin-top:14px;padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line)}.search{display:flex;gap:8px}.search input{flex:1;border:1px solid var(--line);background:#ffffff08;color:#fff;border-radius:14px;padding:13px;font:inherit;text-transform:uppercase}.btn{border:0;border-radius:14px;padding:12px 15px;background:var(--blue);color:#fff;font-weight:850}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.shareBtn{background:linear-gradient(135deg,#2563eb,#7c3aed)}.reportBtn{background:linear-gradient(135deg,#0f766e,#059669)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.plate{font-size:31px;font-weight:950}.pill{display:inline-flex;align-items:center;justify-content:center;min-height:30px;line-height:1;text-align:center;white-space:nowrap;font-size:10px;font-weight:900;padding:7px 11px;border-radius:999px;background:#ffffff0d}.parked{color:#6ee7b7;background:#10b98118}.moving{color:#fbbf24;background:#f59e0b18}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.mini{padding:12px;border-radius:15px;background:#ffffff08}.mini span{display:block;font-size:10px;color:var(--muted)}.mini b{display:block;margin-top:4px;font-size:13px}.section h2{font-size:16px;margin:0 0 10px}.group{margin-top:18px}.groupHead{display:flex;justify-content:space-between;gap:10px;margin-bottom:9px}.groupHead span{font-size:11px;color:var(--muted)}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.media{overflow:hidden;border-radius:16px;background:#ffffff08;border:1px solid var(--line)}.media img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.meta{padding:10px;font-size:11px}.meta b{display:block}.meta span{display:block;color:var(--muted);margin-top:3px}.event,.verify{padding:11px 0;border-bottom:1px solid var(--line)}.event div,.verify div{font-size:11px;color:var(--muted);margin-top:3px}.state{text-align:center;color:var(--muted)}.back{width:100%;margin-top:18px;border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--card);color:#fff;font-weight:850}.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:30}.sheet.on{display:flex}.sheetBox{width:100%;max-width:720px;margin:0 auto;background:#101d30;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));border:1px solid var(--line)}.sheetHead{display:flex;justify-content:space-between;align-items:center}.sheetHead h3{margin:0}.sheetHead button{border:0;background:#ffffff0d;color:#fff;border-radius:12px;width:36px;height:36px}.shareGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.shareOpt{border:1px solid var(--line);background:#ffffff08;color:#fff;border-radius:16px;padding:14px;text-align:left;font-weight:800}.shareOpt small{display:block;color:var(--muted);margin-top:3px;font-weight:500}.shareLink{margin-top:12px;padding:11px;border-radius:13px;background:#08111f;color:#a9b9cc;font-size:11px;word-break:break-all}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,15px);opacity:0;background:#111827;color:#fff;padding:11px 14px;border-radius:13px;transition:.2s;z-index:50;font-size:12px}.toast.on{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.on{display:flex}.modal img{max-width:100%;max-height:85vh;border-radius:16px}.footer{text-align:center;color:#6f8299;font-size:11px;line-height:1.6;margin-top:22px}@media(max-width:420px){.grid,.gallery,.actions,.shareGrid{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="ey">ParkingMartin-G</div><h1>Expediente 360º</h1><section class="card search"><input id="plate" placeholder="Matrícula"><button id="go" class="btn">Buscar</button></section><div id="state" class="card state" hidden></div><div id="content" hidden><section id="summary" class="card"></section><div class="actions"><button id="share" class="btn shareBtn">↗ Compartir</button><button id="report" class="btn reportBtn">📄 Generar informe PDF</button></div><section id="location" class="card section"></section><section class="card section"><h2>📷 Evidencias fotográficas</h2><div id="gallery"></div></section><section class="card section"><h2>🔎 OCR matrícula</h2><div id="ocr"></div></section><section class="card section"><h2>📜 Historial</h2><div id="events"></div></section></div><button class="back" onclick="location.href='./?v=20260831NAV2'">← Volver al inicio</button><footer class="footer">by <b>Allaiso</b> · <span id="year"></span><br>Derechos reservados</footer></main><div id="modal" class="modal"><img id="big"></div><div id="sheet" class="sheet"><div class="sheetBox"><div class="sheetHead"><div><div class="ey">Enlace seguro · 24 horas</div><h3>Compartir expediente</h3></div><button id="closeSheet">×</button></div><div class="shareGrid"><button class="shareOpt" id="wa">🟢 WhatsApp<small>Enviar fuera de Telegram</small></button><button class="shareOpt" id="mail">✉️ Correo (Gmail)<small>Abrir redacción en Gmail</small></button><button class="shareOpt" id="copy">📋 Copiar enlace<small>Pegar donde quieras</small></button><button class="shareOpt" id="tgshare">✈️ Telegram<small>Enviar a un chat</small></button><button class="shareOpt" id="system">↗ Más opciones<small>Menú del sistema si está disponible</small></button><button class="shareOpt" id="openLink">🌐 Abrir enlace<small>Ver expediente compartido</small></button></div><div id="shareLink" class="shareLink"></div></div></div><div id="toast" class="toast"></div><script>const tg=window.Telegram?.WebApp,API='https://mvexykcxnpaywkbnoxwu.supabase.co/functions/v1/vehicle-consult-api',SHARE_API='https://mvexykcxnpaywkbnoxwu.supabase.co/functions/v1/vehicle-share-api',REPORT_API='https://mvexykcxnpaywkbnoxwu.supabase.co/functions/v1/vehicle-report-api',$=id=>document.getElementById(id),input=$('plate');if(tg){tg.ready();tg.expand();window.PMGTheme?.apply()}$('year').textContent=new Date().getFullYear();let currentPlate='',shareUrl='';const qp=new URLSearchParams(location.search).get('plate');if(qp)input.value=qp;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));const fmt=d=>d?new Date(d).toLocaleString('es-ES',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';const day=d=>d?new Date(d).toLocaleDateString('es-ES',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}):'Sin fecha';const time=d=>d?new Date(d).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):'—';const stage={airport_pickup:'Aeropuerto · Recogida',parking:'Parking · Aparcado',parking_exit:'Parking · Salida',airport_delivery:'Aeropuerto · Entrega'};const operation={pickup:'Recogida en aeropuerto',park:'Vehículo aparcado',lookup:'Búsqueda del vehículo',retrieve:'Entrega al cliente'};function show(t){$('state').hidden=false;$('state').textContent=t}function toast(t){$('toast').textContent=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),2200)}function ext(u){try{tg?.openLink?tg.openLink(u):window.open(u,'_blank')}catch{location.href=u}}async function load(){const p=input.value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(p.length<4)return show('Introduce una matrícula válida.');if(!tg?.initData)return show('Abre esta pantalla desde Telegram.');show('Buscando '+p+'…');try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData,plate:p})}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error==='not_found'?'Vehículo no encontrado':d.error||'Error');render(d)}catch(e){show('⚠️ '+(e.message||e))}}function render(d){$('state').hidden=true;$('content').hidden=false;shareUrl='';const v=d.vehicle;currentPlate=v.plate;const s=v.status==='parked'?['APARCADO','parked']:(v.status==='requested'||v.status==='in_transit'?['EN MOVIMIENTO','moving']:(v.status==='retrieved'?['ENTREGADO','']:[String(v.status||'—').toUpperCase(),'']));$('summary').innerHTML=`<div class="row"><div><div class="ey">Vehículo</div><div class="plate">${esc(v.plate)}</div></div><span class="pill ${s[1]}">${s[0]}</span></div><div class="grid"><div class="mini"><span>Aparcado</span><b>${fmt(v.parked_at)}</b></div><div class="mini"><span>Último cambio</span><b>${fmt(v.updated_at)}</b></div></div>`;let loc='<h2>📍 Ubicación</h2>';if(v.current_lat!=null&&v.current_lng!=null){loc+=`<div class="grid"><div class="mini"><span>Precisión</span><b>${v.current_accuracy_m==null?'—':'±'+Math.round(v.current_accuracy_m)+' m'}</b></div><div class="mini"><span>Referencia</span><b>${esc(v.current_location_text||'GPS registrado')}</b></div></div>`;if(v.status==='parked'){const u='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(v.current_lat+','+v.current_lng)+'&travelmode=walking';loc+=`<button class="btn" style="width:100%;margin-top:10px" data-map="${esc(u)}">🧭 Navegar hasta el coche</button>`}}else loc+='<div class="muted">Sin ubicación registrada.</div>';$('location').innerHTML=loc;const ev=(d.evidence||[]).slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)),groups=new Map();for(const e of ev){const k=day(e.created_at)+'||'+(stage[e.stage]||e.stage||'Sin etapa');if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e)}$('gallery').innerHTML=[...groups.entries()].map(([k,items])=>{const [fecha,etapa]=k.split('||');return `<div class="group"><div class="groupHead"><b>${esc(etapa)}</b><span>${esc(fecha)}</span></div><div class="gallery">${items.map(e=>`<div class="media">${e.signed_url?`<img src="${esc(e.signed_url)}" data-img="${esc(e.signed_url)}">`:'<div class="state">Imagen no disponible</div>'}<div class="meta"><b>${time(e.created_at)} · ${esc(e.uploaded_by_worker?.full_name||'Operario')}</b><span>${esc(etapa)}</span></div></div>`).join('')}</div></div>`}).join('')||'<div class="muted">Sin evidencias.</div>';$('ocr').innerHTML=(d.verifications||[]).map(x=>`<div class="verify"><b>${x.result==='matched'?'✅ Verificada':x.result==='overridden'?'⚠️ Ignorada':x.result==='mismatch'?'⚠️ No coincide':'OCR'}</b><div>Esperada: ${esc(x.expected_plate||'—')} · Detectada: ${esc(x.detected_plate||'—')} · ${fmt(x.created_at)}</div></div>`).join('')||'<div class="muted">Sin verificaciones OCR.</div>';$('events').innerHTML=(d.events||[]).map(e=>`<div class="event"><b>${esc(operation[e.operation]||e.operation||'Evento')}</b><div>${fmt(e.created_at)} · ${esc(e.worker?.full_name||'Operario')}</div></div>`).join('')||'<div class="muted">Sin historial.</div>';document.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>ext(b.dataset.map));document.querySelectorAll('[data-img]').forEach(i=>i.onclick=()=>{$('big').src=i.dataset.img;$('modal').classList.add('on')})}async function getShare(){if(shareUrl)return shareUrl;const r=await fetch(SHARE_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'create',initData:tg.initData,plate:currentPlate})}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'No se pudo crear el enlace');return shareUrl=d.url}async function openShare(){try{$('shareLink').textContent=await getShare();$('sheet').classList.add('on')}catch(e){toast('⚠️ '+(e.message||e))}}async function report(){try{const r=await fetch(REPORT_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData,plate:currentPlate})}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'No se pudo generar el informe');ext(d.url)}catch(e){toast('⚠️ '+(e.message||e))}}$('go').onclick=load;$('plate').addEventListener('keydown',e=>{if(e.key==='Enter')load()});$('share').onclick=openShare;$('report').onclick=report;$('closeSheet').onclick=()=>$('sheet').classList.remove('on');$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(shareUrl);toast('Enlace copiado')}catch{toast('No se pudo copiar')}};$('wa').onclick=()=>ext('https://wa.me/?text='+encodeURIComponent('Expediente '+currentPlate+' · '+shareUrl));$('mail').onclick=()=>ext('https://mail.google.com/mail/?view=cm&fs=1&su='+encodeURIComponent('Expediente '+currentPlate)+'&body='+encodeURIComponent('Expediente de solo lectura válido durante 24 horas:\n\n'+shareUrl));$('tgshare').onclick=()=>{const u='https://t.me/share/url?url='+encodeURIComponent(shareUrl)+'&text='+encodeURIComponent('Expediente '+currentPlate+' · solo lectura 24 h');tg?.openTelegramLink?tg.openTelegramLink(u):ext(u)};$('openLink').onclick=()=>ext(shareUrl);$('system').onclick=async()=>{if(!navigator.share)return toast('El WebView de Telegram no ofrece el menú general.');try{await navigator.share({title:'Expediente '+currentPlate,text:'Expediente de solo lectura válido 24 h',url:shareUrl})}catch{}};$('modal').onclick=()=>$('modal').classList.remove('on');if(qp)load();</script></body></html>
