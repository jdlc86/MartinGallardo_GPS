<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=1"><link rel="stylesheet" href="theme.css?v=9" data-pmg-theme><script src="theme.js?v=8" data-pmg-theme></script><script src="ux-errors.js?v=9"></script><title>Actividad reciente · ParkingMartin-G</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>:root{--bg:var(--pmg-bg);--card:var(--pmg-surface);--text:var(--pmg-text);--muted:var(--pmg-muted);--line:var(--pmg-border)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}.app{max-width:640px;margin:auto;padding:22px 16px 34px}.ey{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7dd3fc;font-weight:900}h1{margin:3px 0 0;font-size:28px}.state,.event{background:var(--card);border:1px solid var(--line);border-radius:18px}.state{margin-top:18px;padding:18px;text-align:center;color:var(--muted)}.timeline{margin-top:18px}.event{padding:14px;margin-bottom:9px;display:flex;gap:12px}.icon{width:42px;height:42px;border-radius:14px;background:#ffffff0d;display:grid;place-items:center;flex:none}.info{flex:1;min-width:0}.info b{display:block;font-size:14px}.info span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.meta{font-size:11px;color:#9fb0c5;margin-top:6px}.back{width:100%;margin-top:18px;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:#fff;font-weight:850}</style></head><body><main class="app"><div class="ey">Trazabilidad operativa</div><h1>Actividad reciente</h1><div id="state" class="state">Cargando movimientos reales…</div><div id="timeline" class="timeline"></div><button class="back" onclick="location.href='./?v=20260831NAV2'">← Volver al inicio</button></main><script>const tg=window.Telegram?.WebApp,API='https://mvexykcxnpaywkbnoxwu.supabase.co/functions/v1/telegram-modern-action';if(tg){tg.ready();tg.expand()}const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(d){return d?new Date(d).toLocaleString('es-ES',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—'}function op(o){return({pickup:['✈️','Recogida en aeropuerto'],park:['🅿️','Vehículo aparcado'],relocate:['🔄','Vehículo reubicado'],retrieve:['🏁','Entrega al cliente'],lookup:['🔎','Consulta del vehículo'],plate_verification_override:['⚠️','OCR ignorado por operario']})[o]||['•',String(o||'Evento')]}async function load(){if(!tg?.initData){$('state').textContent='Abre esta pantalla desde Telegram.';return}try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData,action:'recent_activity'})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Error');const rows=d.events||[];$('state').hidden=!!rows.length;if(!rows.length)$('state').textContent='No hay actividad registrada.';$('timeline').innerHTML=rows.map(e=>{const a=op(e.operation),plate=e.vehicle?.plate||'Vehículo',who=e.worker?.full_name||'Operario';return `<div class="event" ${e.vehicle?.plate?`data-plate="${esc(e.vehicle.plate)}"`:''}><div class="icon">${a[0]}</div><div class="info"><b>${esc(a[1])} · ${esc(plate)}</b><span>${esc(e.location_text||'Sin referencia de ubicación')}</span><div class="meta">${fmt(e.created_at)} · ${esc(who)}</div></div></div>`}).join('');document.querySelectorAll('[data-plate]').forEach(x=>x.onclick=()=>location.href='vehicle-v7.html?v=20260831NAV2&plate='+encodeURIComponent(x.dataset.plate))}catch(e){$('state').textContent='⚠️ '+(window.PMGFriendlyError?PMGFriendlyError(e):e.message||e)}}load();</script></body></html>
