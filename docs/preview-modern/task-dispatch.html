<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><link rel="stylesheet" href="theme.css?v=9"><script src="theme.js?v=8"></script><script src="ux-errors.js?v=11"></script><script src="https://telegram.org/js/telegram-web-app.js"></script><title>Asignación de tareas</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--pmg-bg);color:var(--pmg-text);font-family:Inter,system-ui,sans-serif}.app{max-width:980px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 12px calc(94px + env(safe-area-inset-bottom))}.ey{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--pmg-accent-text);font-weight:900}h1{margin:4px 0 5px;font-size:27px}.sub{font-size:12px;color:var(--pmg-muted);line-height:1.4}.filters{display:flex;gap:6px;overflow:auto;padding:13px 0 9px;scrollbar-width:none}.chip{white-space:nowrap;padding:8px 11px;border-radius:999px;border:1px solid var(--pmg-border);background:var(--pmg-surface);color:var(--pmg-muted);font-size:10px;font-weight:850}.chip.on{background:var(--pmg-info-soft);color:var(--pmg-info-text);border-color:var(--pmg-info-border)}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:7px;margin-bottom:10px}.search{height:42px;border:1px solid var(--pmg-border);border-radius:13px;background:var(--pmg-input);color:var(--pmg-text);padding:0 12px}.refresh{min-width:42px;height:42px;border:1px solid var(--pmg-border);border-radius:13px;background:var(--pmg-surface);color:var(--pmg-text)}.ai-btn{height:42px;border:1px solid var(--pmg-info-border);border-radius:13px;background:var(--pmg-info-soft);color:var(--pmg-info-text);padding:0 13px;font-weight:950;white-space:nowrap}.day{margin-top:16px}.dayhead{display:flex;justify-content:space-between;align-items:center;padding:0 4px 7px}.dayhead b{font-size:12px}.dayhead button{border:0;background:none;color:var(--pmg-accent-text);font-size:10px;font-weight:850}.list{display:grid;gap:5px}.task{display:grid;grid-template-columns:25px 52px 68px minmax(82px,.7fr) minmax(90px,1fr) minmax(78px,.7fr);gap:7px;align-items:center;padding:10px 9px;border-radius:14px;background:var(--pmg-surface);border:1px solid var(--pmg-border);font-size:10px}.task.selected{border-color:var(--pmg-accent);background:var(--pmg-info-soft)}.task input{width:18px;height:18px;accent-color:var(--pmg-accent)}.time{font-weight:950;font-size:12px}.type{font-weight:950}.pickup{color:var(--pmg-info-text)}.delivery{color:var(--pmg-success-text)}.plate{font-weight:950;font-size:11px}.muted{color:var(--pmg-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.who{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.unassigned{color:var(--pmg-warning-text)}.empty{padding:30px 16px;text-align:center;color:var(--pmg-muted);border:1px dashed var(--pmg-border);border-radius:17px}.assignbar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:960px;margin:auto;display:none;grid-template-columns:auto 1fr auto;gap:7px;align-items:center;padding:9px;border-radius:17px;background:color-mix(in srgb,var(--pmg-surface) 96%,transparent);border:1px solid var(--pmg-border);box-shadow:0 16px 45px #0007;backdrop-filter:blur(18px);z-index:20}.assignbar.on{display:grid}.count{font-size:11px;font-weight:950;padding:0 5px}.assignbar select{min-width:0;height:42px;border-radius:12px;border:1px solid var(--pmg-border);background:var(--pmg-input);color:var(--pmg-text);padding:0 9px}.assign{height:42px;border:0;border-radius:12px;background:var(--pmg-accent);color:#fff;padding:0 13px;font-weight:900}.back{width:100%;margin-top:20px;min-height:46px;border-radius:14px;border:1px solid var(--pmg-border);background:var(--pmg-surface);color:var(--pmg-text);font-weight:850}.toast{position:fixed;left:50%;bottom:85px;transform:translate(-50%,12px);opacity:0;transition:.2s;padding:11px 14px;border-radius:13px;background:#111827;color:white;font-size:11px;z-index:30}.toast.on{opacity:1;transform:translate(-50%,0)}@media(max-width:650px){.task{grid-template-columns:22px 45px 58px 72px 1fr}.task .customer{display:none}.task .who{grid-column:5}.assignbar{grid-template-columns:auto 1fr}.assign{grid-column:1/-1}.app{padding-left:9px;padding-right:9px}.toolbar{grid-template-columns:1fr auto}.ai-btn{grid-column:1/-1;width:100%}}</style></head><body><main class="app"><div class="ey">Planificación operativa</div><h1>Asignación de tareas</h1><div class="sub">Selecciona recogidas y entregas de cualquier día y asígnalas en bloque a Administradores u Operarios activos. La última asignación confirmada es la válida.</div><div class="filters"><button class="chip on" data-filter="all">Todas</button><button class="chip" data-filter="pickup">✈️ Recogidas</button><button class="chip" data-filter="delivery">🏁 Entregas</button><button class="chip" data-filter="unassigned">Sin asignar</button><button class="chip" data-filter="assigned">Asignadas</button></div><div class="toolbar"><input id="search" class="search" placeholder="Matrícula, cliente, terminal o responsable"><button id="refresh" class="refresh">↻</button><button id="aiAssistant" class="ai-btn">✨ Asistente IA</button></div><div id="content"><div class="empty">Cargando tareas…</div></div><button id="back" class="back">← Volver al inicio</button></main><div id="assignbar" class="assignbar"><div id="count" class="count">0</div><select id="worker"><option value="">Seleccionar responsable…</option></select><button id="assign" class="assign">Asignar</button></div><div id="toast" class="toast"></div><script>const tg=window.Telegram?.WebApp,API='https://mvexykcxnpaywkbnoxwu.supabase.co/functions/v1/reservation-task-api',$=id=>document.getElementById(id);if(tg){tg.ready();tg.expand();window.PMGTheme?.apply()}let data={tasks:[],workers:[]},selected=new Set(),filter='all';function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function roleLabel(r){return r==='owner'?'Root':r==='admin'?'Admin':'Operario'}function toast(t){$('toast').textContent=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),2600)}async function api(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg?.initData||'',action,...extra})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'network_error');return d}function dateKey(x){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(x))}function dateLabel(x){return new Intl.DateTimeFormat('es-ES',{timeZone:'Europe/Madrid',weekday:'long',day:'2-digit',month:'long'}).format(new Date(x))}function hm(x){return new Intl.DateTimeFormat('es-ES',{timeZone:'Europe/Madrid',hour:'2-digit',minute:'2-digit'}).format(new Date(x))}function visible(){const q=$('search').value.trim().toLowerCase();return data.tasks.filter(t=>{if(filter==='pickup'&&t.type!=='pickup')return false;if(filter==='delivery'&&t.type!=='delivery')return false;if(filter==='unassigned'&&t.assigned_worker)return false;if(filter==='assigned'&&!t.assigned_worker)return false;if(q&&!`${t.plate} ${t.customer_name} ${t.terminal} ${t.assigned_worker?.full_name||''}`.toLowerCase().includes(q))return false;return true})}function render(){const groups={};for(const t of visible())(groups[dateKey(t.scheduled_at)]??=[]).push(t);$('content').innerHTML=Object.keys(groups).sort().map(k=>`<section class="day"><div class="dayhead"><b>${esc(dateLabel(groups[k][0].scheduled_at))}</b><button data-day="${k}">Seleccionar día</button></div><div class="list">${groups[k].map(t=>`<label class="task ${selected.has(t.id)?'selected':''}"><input type="checkbox" data-id="${t.id}" ${selected.has(t.id)?'checked':''}><span class="time">${hm(t.scheduled_at)}</span><span class="type ${t.type}">${t.type==='pickup'?'RECOG.':'ENTREGA'}</span><span><span class="plate">${esc(t.plate||'—')}</span><br><span class="muted">${esc(t.terminal||'Terminal —')}</span></span><span class="customer muted">${esc(t.customer_name||'—')}</span><span class="who ${t.assigned_worker?'':'unassigned'}">${esc(t.assigned_worker?.full_name||'SIN ASIGNAR')}</span></label>`).join('')}</div></section>`).join('')||'<div class="empty">No hay tareas con estos filtros.</div>';document.querySelectorAll('[data-id]').forEach(x=>x.onchange=()=>{x.checked?selected.add(x.dataset.id):selected.delete(x.dataset.id);render();bar()});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{for(const t of groups[b.dataset.day])selected.add(t.id);render();bar()});bar()}function bar(){$('count').textContent=selected.size+' seleccionada'+(selected.size===1?'':'s');$('assignbar').classList.toggle('on',selected.size>0)}async function load(){try{data=await api('dispatch');selected.clear();$('worker').innerHTML='<option value="">Seleccionar responsable…</option>'+data.workers.map(w=>`<option value="${w.id}">${esc(w.full_name)} · ${roleLabel(w.role)}</option>`).join('');render()}catch(e){$('content').innerHTML='<div class="empty">⚠️ '+esc(window.PMGFriendlyError?window.PMGFriendlyError(e.message):e.message)+'</div>'}}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.filter;render()});$('search').oninput=render;$('refresh').onclick=load;$('back').onclick=()=>{location.href='./'};$('aiAssistant').onclick=()=>{location.href='ai-dispatch.html?v=20260904AI8'};$('assign').onclick=async()=>{const wid=$('worker').value;if(!wid)return toast('Selecciona un responsable.');const tasks=data.tasks.filter(t=>selected.has(t.id)),already=tasks.filter(t=>t.assigned_worker&&t.assigned_worker.id!==wid);if(already.length){const names=[...new Set(already.map(t=>t.assigned_worker.full_name))].join(', ');if(!confirm(`${already.length} tarea${already.length===1?' está':'s están'} asignada${already.length===1?'':'s'} a ${names}. ¿Quieres reasignarla${already.length===1?'':'s'} al operario seleccionado?`))return}const b=$('assign');b.disabled=true;try{await api('assign',{target_worker_id:wid,items:tasks.map(t=>({id:t.id,version:t.version}))});toast('Asignación actualizada.');await load()}catch(e){if(e.message==='task_assignment_conflict'){alert('Una de las tareas cambió mientras la estabas asignando. La lista se actualizará para que confirmes el responsable actual.');await load()}else toast(window.PMGFriendlyError?window.PMGFriendlyError(e.message):e.message)}finally{b.disabled=false}};document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});window.addEventListener('pmg:online',load);load();</script></body></html>
