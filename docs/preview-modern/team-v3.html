<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><title>Equipo & Accesos</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>:root{color-scheme:dark;--bg:#08111f;--card:#101d30;--text:#eef5ff;--muted:#91a4bb;--line:rgba(255,255,255,.09);--blue:#2563eb}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}.app{max-width:580px;margin:auto;padding:22px 16px 34px}.head{display:flex;justify-content:space-between;align-items:center}.ey{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:900}h1{font-size:26px;margin:3px 0}.shield{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#2563eb);font-size:21px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}.stat{padding:13px 6px;border-radius:17px;background:var(--card);border:1px solid var(--line);text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:var(--muted)}.state{margin-top:20px;padding:22px;border-radius:20px;background:var(--card);border:1px solid var(--line);text-align:center;color:var(--muted)}.state.err{color:#fca5a5;border-color:#ef444444}.section{margin-top:24px}.section h2{font-size:15px;margin:0 0 10px}.person,.req{padding:14px;border-radius:19px;background:var(--card);border:1px solid var(--line);margin-bottom:9px}.row{display:flex;align-items:center;gap:11px}.avatar{width:42px;height:42px;border-radius:14px;background:#ffffff0e;display:grid;place-items:center;font-weight:900;flex:none}.avatar.owner{background:linear-gradient(135deg,#f59e0b,#f97316)}.avatar.admin{background:linear-gradient(135deg,#7c3aed,#4f46e5)}.info{flex:1;min-width:0}.info b{display:block;font-size:14px}.info small{display:block;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tag{font-size:9px;font-weight:900;padding:6px 7px;border-radius:999px;background:#ffffff0d}.gold{color:#fde68a;background:#f59e0b18}.green{color:#6ee7b7;background:#10b98118}.red{color:#fca5a5;background:#ef444418}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.btn{border:0;border-radius:11px;padding:9px 11px;background:var(--blue);color:#fff;font-weight:850;font-size:11px}.btn.alt{background:#ffffff0d}.btn.danger{background:#7f1d1d}.empty{padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:13px}.back{width:100%;margin-top:22px;border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--card);color:var(--text);font-weight:850}</style></head><body><main class="app"><div class="head"><div><div class="ey">Administración</div><h1>Equipo & Accesos</h1></div><div class="shield">🛡️</div></div><div class="stats"><div class="stat"><b id="a">—</b><span>Activos</span></div><div class="stat"><b id="ad">—</b><span>Admins</span></div><div class="stat"><b id="p">—</b><span>Pendientes</span></div><div class="stat"><b id="b">—</b><span>Bloqueados</span></div></div><div id="state" class="state">Cargando equipo real…</div><div id="content" hidden><section class="section"><h2>Solicitudes pendientes</h2><div id="pending"></div></section><section class="section"><h2>Equipo activo</h2><div id="active"></div></section><section class="section"><h2>Bloqueados</h2><div id="blocked"></div></section><button id="back" class="back">← Volver a la App Moderna</button></div></main><script>(function(){var tg=window.Telegram&&window.Telegram.WebApp;var API='https://mvexykcxnpaywkbnoxwu.supabase.co/functions/v1/telegram-modern-action';function el(id){return document.getElementById(id)}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function nm(x){var s=[x.first_name,x.last_name].filter(Boolean).join(' ');return s||(x.username?'@'+x.username:'Usuario '+x.telegram_user_id)}function ini(x){var n=nm(x).replace('@','').split(/\s+/);return((n[0]&&n[0][0])||'?')+((n[1]&&n[1][0])||'')}function api(action,extra){return new Promise(function(resolve,reject){if(!tg||!tg.initData){reject(new Error('Esta pantalla debe abrirse desde Telegram.'));return}var ctl=new AbortController();var timer=setTimeout(function(){ctl.abort()},10000);fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},signal:ctl.signal,body:JSON.stringify(Object.assign({initData:tg.initData,action:action},extra||{}))}).then(function(r){return r.json().then(function(d){if(!r.ok||!d.ok)throw new Error(d.error||'Error de servidor');return d})}).then(resolve).catch(function(e){reject(e.name==='AbortError'?new Error('El servidor tardó demasiado en responder.'):e)}).finally(function(){clearTimeout(timer)})})}function buttons(x,blocked,me){if(x.role==='owner'||Number(x.telegram_user_id)===me)return'';if(blocked)return'<div class="actions"><button class="btn" data-op="reactivate" data-id="'+x.telegram_user_id+'">♻ Reactivar</button></div>';return'<div class="actions">'+(x.role==='operario'?'<button class="btn alt" data-op="promote" data-id="'+x.telegram_user_id+'">🛡 Hacer admin</button>':'<button class="btn alt" data-op="demote" data-id="'+x.telegram_user_id+'">👤 Quitar admin</button>')+'<button class="btn danger" data-op="deactivate" data-id="'+x.telegram_user_id+'">⛔ Dar de baja</button></div>'}function card(x,blocked,me){var cls=x.role==='owner'?'owner':x.role==='admin'?'admin':'';var tag=blocked?'<span class="tag red">BLOQUEADO</span>':x.role==='owner'?'<span class="tag gold">OWNER</span>':x.role==='admin'?'<span class="tag">ADMIN</span>':'<span class="tag green">ACTIVO</span>';return'<div class="person"><div class="row"><div class="avatar '+cls+'">'+esc(ini(x))+'</div><div class="info"><b>'+esc(nm(x))+'</b><small>'+(blocked?'Acceso retirado':x.role==='owner'?'Cuenta protegida':x.role==='admin'?'Administrador':'Operario')+'</small></div>'+tag+'</div>'+buttons(x,blocked,me)+'</div>'}function render(d){var me=Number(tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.id);el('a').textContent=d.stats.active;el('ad').textContent=d.stats.admins;el('p').textContent=d.stats.pending;el('b').textContent=d.stats.blocked;el('pending').innerHTML=d.pending.length?d.pending.map(function(x){return'<div class="req"><div class="row"><div class="avatar">'+esc(ini(x))+'</div><div class="info"><b>'+esc(nm(x))+'</b><small>Solicitud pendiente</small></div></div><div class="actions"><button class="btn" data-op="approve" data-id="'+x.telegram_user_id+'">✓ Autorizar</button><button class="btn alt" data-op="approve_admin" data-id="'+x.telegram_user_id+'">🛡 Como admin</button><button class="btn danger" data-op="reject" data-id="'+x.telegram_user_id+'">Rechazar</button></div></div>'}).join(''):'<div class="empty">No hay solicitudes pendientes.</div>';el('active').innerHTML=d.active.length?d.active.map(function(x){return card(x,false,me)}).join(''):'<div class="empty">No hay usuarios activos.</div>';el('blocked').innerHTML=d.blocked.length?d.blocked.map(function(x){return card(x,true,me)}).join(''):'<div class="empty">No hay usuarios bloqueados.</div>';el('state').hidden=true;el('content').hidden=false;bind()}function bind(){Array.prototype.forEach.call(document.querySelectorAll('[data-op]'),function(btn){btn.onclick=function(){var op=btn.getAttribute('data-op'),id=Number(btn.getAttribute('data-id'));var msg='¿Confirmas esta acción sobre el usuario?';var go=function(ok){if(!ok)return;btn.disabled=true;api('admin_action',{target_id:id,admin_action:op}).then(render).catch(showErr).finally(function(){btn.disabled=false})};if(tg&&tg.showConfirm)tg.showConfirm(msg,go);else go(window.confirm(msg))}})}function showErr(e){el('state').hidden=false;el('state').className='state err';el('state').textContent='⚠️ '+String(e&&e.message?e.message:e);el('content').hidden=true}if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#08111f');tg.setBackgroundColor('#08111f');if(tg.setBottomBarColor)tg.setBottomBarColor('#08111f')}catch(e){}}el('back').onclick=function(){location.href='./?v=20260831H'};setTimeout(function(){if(!el('state').hidden&&el('state').textContent.indexOf('Cargando')===0)showErr(new Error('La pantalla no pudo iniciar correctamente.'))},12000);api('team_dashboard').then(render).catch(showErr)})();</script></body></html>
