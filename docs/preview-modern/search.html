<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#08111f"><link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=1"><link rel="stylesheet" href="theme.css?v=9" data-pmg-theme><script src="theme.js?v=8" data-pmg-theme></script><script src="ux-errors.js?v=11"></script><title>Buscar coche</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>:root{--bg:var(--pmg-bg);--surface:var(--pmg-surface);--text:var(--pmg-text);--muted:var(--pmg-muted);--line:var(--pmg-border);--blue:var(--pmg-accent);--good:var(--pmg-success)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}.app{max-width:620px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}.ey{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#7dd3fc;font-weight:900}h1{font-size:28px;margin:5px 0 0}.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:16px}.title{font-size:18px;font-weight:900}.sub{color:var(--muted);font-size:13px;line-height:1.45;margin-top:5px}.input{width:100%;margin-top:16px;padding:15px;border-radius:15px;border:1px solid var(--line);background:#ffffff08;color:#fff;font:inherit;font-size:19px;text-transform:uppercase}.btn{width:100%;border:0;border-radius:15px;padding:14px 16px;font:inherit;font-weight:900;background:var(--blue);color:#fff;margin-top:10px}.btn.secondary{background:#ffffff08;border:1px solid var(--line)}.btn.good{background:#0f7a4a}.hidden{display:none!important}.plate{font-size:30px;font-weight:950;letter-spacing:.03em}.badge{display:inline-flex;margin-top:8px;padding:7px 10px;border-radius:999px;background:#10b98122;color:#6ee7b7;font-size:11px;font-weight:900}.rows{margin-top:14px}.row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row span{color:var(--muted);font-size:12px}.row b{text-align:right;font-size:13px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,15px);opacity:0;background:#111827;padding:11px 14px;border-radius:13px;font-size:12px;transition:.2s;z-index:20}.toast.on{opacity:1;transform:translate(-50%,0)}</style></head><body><main class="app"><div class="ey">ParkingMartin-G</div><h1>Buscar coche</h1><section id="searchCard" class="card"><div class="title">Matrícula</div><div class="sub">Introduce la matrícula del vehículo que quieres localizar.</div><input id="plate" class="input" placeholder="1234ABC" autocomplete="off"><button id="search" class="btn">🔎 Buscar vehículo</button></section><section id="result" class="card hidden"><div class="plate" id="rPlate"></div><div class="badge">● APARCADO</div><div class="rows"><div class="row"><span>Ubicación</span><b id="rText">—</b></div><div class="row"><span>Precisión GPS</span><b id="rAcc">—</b></div><div class="row"><span>Aparcado</span><b id="rWhen">—</b></div><div class="row"><span>Operario</span><b id="rWho">—</b></div></div><button id="navigate" class="btn good hidden">🧭 Navegar hasta el coche</button><button id="file" class="btn">🚘 Ver Expediente 360º</button><button id="again" class="btn secondary">🔎 Buscar otro vehículo</button></section></main><div id="toast" class="toast"></div><script>const tg=window.Telegram?.WebApp,API='https://mvexykcxnpaywkbnoxwu.supabase.co/functions/v1/modern-search-api',$=id=>document.getElementById(id);if(tg){tg.ready();tg.expand();window.PMGTheme?.apply()}let current=null;function toast(t){$('toast').textContent=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),2200)}function fmt(d){if(!d)return'—';try{return new Intl.DateTimeFormat('es-ES',{dateStyle:'medium',timeStyle:'short'}).format(new Date(d))}catch{return d}}async function run(){const p=$('plate').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(p.length<4)return toast('Introduce una matrícula válida.');const b=$('search');b.disabled=true;b.textContent='Buscando…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg?.initData||'',plate:p})}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'Error');current=d.vehicle;$('rPlate').textContent=current.plate;$('rText').textContent=current.location_text||'Sin referencia manual';$('rAcc').textContent=current.accuracy_m==null?'No informada':'±'+Math.round(Number(current.accuracy_m))+' m';$('rWhen').textContent=fmt(current.parked_at);$('rWho').textContent=current.parked_by||'No informado';$('searchCard').classList.add('hidden');$('result').classList.remove('hidden');const lat=Number(current.latitude),lng=Number(current.longitude);$('navigate').classList.toggle('hidden',!(Number.isFinite(lat)&&Number.isFinite(lng)));tg?.HapticFeedback?.notificationOccurred('success')}catch(e){toast(e.message==='not_parked'?'Ese vehículo no figura actualmente como aparcado.':e.message);tg?.HapticFeedback?.notificationOccurred('error')}finally{b.disabled=false;b.textContent='🔎 Buscar vehículo'}}$('search').onclick=run;$('plate').addEventListener('keydown',e=>{if(e.key==='Enter')run()});$('navigate').onclick=()=>{if(!current)return;const lat=Number(current.latitude),lng=Number(current.longitude);if(!Number.isFinite(lat)||!Number.isFinite(lng))return;const url=`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(lat+','+lng)}&travelmode=walking&dir_action=navigate`;try{tg?.openLink?tg.openLink(url):window.open(url,'_blank')}catch{location.href=url}};$('file').onclick=()=>{if(current)location.href='vehicle-v6.html?v=20260831S&plate='+encodeURIComponent(current.plate)};$('again').onclick=()=>{current=null;$('result').classList.add('hidden');$('searchCard').classList.remove('hidden');$('plate').value='';$('plate').focus()};</script></body></html>
