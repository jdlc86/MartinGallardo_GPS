<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Expediente del vehículo</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#111)}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:var(--tg-theme-secondary-bg-color,#f3f3f3);border-radius:14px;padding:14px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0}.label{opacity:.65}.badge{font-weight:800}.group{margin:18px 0}.group h3{margin:0 0 10px;font-size:17px}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.media{background:rgba(128,128,128,.08);border-radius:12px;overflow:hidden}.media img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.meta{padding:9px;font-size:13px}.meta b{display:block;margin-bottom:3px}.event{padding:11px 0;border-bottom:1px solid rgba(128,128,128,.2)}h1,h2{margin:8px 0 12px}button,input{box-sizing:border-box;width:100%;padding:14px;border-radius:12px;font-size:16px;margin:6px 0}button{border:0;font-weight:700;background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff)}input{border:1px solid rgba(128,128,128,.35);background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#111);text-transform:uppercase}.err{color:#b00020}.small{font-size:12px;opacity:.65}.doc{padding:18px;text-align:center}.section-note{font-size:13px;opacity:.7;margin-top:-4px}@media(max-width:520px){.gallery{grid-template-columns:1fr 1fr}.row{flex-direction:column;gap:2px}}</style></head><body><div class="wrap"><h1 id="title">📋 Consultar vehículo</h1><div id="search" class="card"><input id="plate" placeholder="Matrícula" autocomplete="off"><button id="go">CONSULTAR</button></div><div id="status" class="card" style="display:none"></div><div id="content" style="display:none"><div class="card" id="summary"></div><div class="card" id="location"></div><div class="card"><h2>📷 Fotos y documentación</h2><div class="section-note">Ordenadas de la más reciente a la más antigua</div><div id="gallery"></div></div><div class="card"><h2>🔎 Verificaciones de matrícula</h2><div id="ocr"></div></div><div class="card"><h2>📜 Historial completo</h2><div class="section-note">De lo más reciente a lo más antiguo</div><div id="events"></div></div><button id="another">🔎 CONSULTAR OTRO VEHÍCULO</button></div><div class="small">Expediente dentro de Telegram · los enlaces de evidencia son temporales</div></div><script>const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();}const API='https://mvexykcxnpaywkbnoxwu.supabase.co/functions/v1/vehicle-consult-api';const input=document.getElementById('plate'),go=document.getElementById('go'),search=document.getElementById('search'),status=document.getElementById('status'),content=document.getElementById('content');const initial=(new URLSearchParams(location.search).get('plate')||'').toUpperCase();if(initial)input.value=initial;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dt=d=>d?new Date(d):null;const fmt=d=>d?dt(d).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';const time=d=>d?dt(d).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):'—';const day=d=>d?dt(d).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}):'Sin fecha';const statusName={parked:'APARCADO',requested:'SOLICITADO',in_transit:'EN TRÁNSITO',retrieved:'ENTREGADO'};const stageName={airport_pickup:'Aeropuerto · Recogida',parking:'Parking · Aparcado',parking_exit:'Parking · Salida',airport_delivery:'Aeropuerto · Entrega'};const evidenceName={state_photo:'Foto del estado',plate_photo:'Foto de matrícula',documentation:'Documentación',location_photo:'Foto de ubicación',delivery_photo:'Foto de entrega'};const opName={lookup:'Consulta del vehículo',park:'Vehículo aparcado',pickup:'Recogida en aeropuerto',retrieve:'Entrega al cliente',plate_verification_override:'Verificación de matrícula ignorada'};const verifyName={matched:'✅ Matrícula verificada',mismatch:'⚠️ Matrícula no coincide',ocr_failed:'⚠️ No se pudo leer la matrícula',overridden:'⚠️ Verificación ignorada por operario'};async function load(){const plate=input.value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(plate.length<4){status.style.display='block';status.innerHTML='<span class="err">Introduce una matrícula válida.</span>';return}if(!tg||!tg.initData){status.style.display='block';status.innerHTML='<span class="err">Esta página debe abrirse desde Telegram.</span>';return}go.disabled=true;status.style.display='block';status.textContent='Cargando expediente…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData,plate})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error==='not_found'?'Vehículo no encontrado':d.error||'No se pudo cargar');render(d)}catch(e){status.innerHTML='<span class="err">'+esc(e.message||e)+'</span>'}finally{go.disabled=false}}function render(d){const v=d.vehicle;document.getElementById('title').textContent='📋 '+v.plate;search.style.display='none';status.style.display='none';content.style.display='block';document.getElementById('summary').innerHTML='<div class="row"><span class="label">Estado</span><span class="badge">'+esc(statusName[v.status]||v.status)+'</span></div><div class="row"><span class="label">Aparcado</span><span>'+fmt(v.parked_at)+'</span></div><div class="row"><span class="label">Última actualización</span><span>'+fmt(v.updated_at)+'</span></div>';let loc='';if(v.current_lat!=null&&v.current_lng!=null){const map='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(v.current_lat+','+v.current_lng)+'&travelmode=walking&dir_action=navigate';loc+='<div class="row"><span class="label">Coordenadas</span><span>'+Number(v.current_lat).toFixed(6)+', '+Number(v.current_lng).toFixed(6)+'</span></div><div class="row"><span class="label">Precisión GPS</span><span>'+(v.current_accuracy_m==null?'—':'±'+Math.round(v.current_accuracy_m)+' m')+'</span></div>';if(v.status==='parked')loc+='<button onclick="location.href=\''+map+'\'">🧭 NAVEGAR HASTA EL COCHE</button>';else loc+='<div class="section-note">Ubicación histórica · el vehículo ya no figura como aparcado.</div>'}if(v.current_location_text)loc+='<div class="row"><span class="label">Referencia</span><span>'+esc(v.current_location_text)+'</span></div>';document.getElementById('location').innerHTML='<h2>📍 Ubicación actual</h2>'+loc;renderEvidence(d.evidence||[]);document.getElementById('ocr').innerHTML=d.verifications.length?d.verifications.map(x=>'<div class="event"><b>'+esc(verifyName[x.result]||x.result)+'</b><br>'+esc(stageName[x.stage]||x.stage)+'<br>Esperada: <b>'+esc(x.expected_plate)+'</b> · Detectada: <b>'+esc(x.detected_plate||'No leída')+'</b><br><span class="small">'+fmt(x.created_at)+(x.worker?' · '+esc(x.worker.full_name):'')+'</span></div>').join(''):'Sin verificaciones registradas';document.getElementById('events').innerHTML=d.events.length?d.events.map(e=>'<div class="event"><b>'+esc(opName[e.operation]||e.operation)+'</b>'+(e.location_text?'<br>'+esc(e.location_text):'')+'<br><span class="small">'+fmt(e.created_at)+(e.worker?' · '+esc(e.worker.full_name):'')+'</span></div>').join(''):'Sin historial'}function renderEvidence(items){items=[...items].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));const groups=new Map();for(const e of items){const key=day(e.created_at)+'|'+(stageName[e.stage]||e.stage||'Sin etapa');if(!groups.has(key))groups.set(key,[]);groups.get(key).push(e)}let html='';for(const [key,arr] of groups){const [fecha,etapa]=key.split('|');html+='<div class="group"><h3>'+esc(fecha)+' · '+esc(etapa)+'</h3><div class="gallery">';for(const e of arr){const who=e.uploaded_by_worker?.full_name||'Operario no identificado',label=evidenceName[e.evidence_type]||e.evidence_type,meta='<div class="meta"><b>'+esc(label)+'</b>'+esc(time(e.created_at))+' · '+esc(who)+'</div>';if(e.media_type==='photo'&&e.signed_url){html+='<div class="media"><a href="'+esc(e.signed_url)+'"><img src="'+esc(e.signed_url)+'" alt="'+esc(label)+'"></a>'+meta+'</div>'}else if(e.signed_url){html+='<div class="media"><a href="'+esc(e.signed_url)+'"><div class="doc">📄<br>'+esc(label)+'</div></a>'+meta+'</div>'}else{html+='<div class="media"><div class="doc">⚠️ Archivo no disponible</div>'+meta+'</div>'}}html+='</div></div>'}document.getElementById('gallery').innerHTML=html||'Sin fotos ni documentación'}go.onclick=load;input.addEventListener('keydown',e=>{if(e.key==='Enter')load()});document.getElementById('another').onclick=()=>{content.style.display='none';search.style.display='block';document.getElementById('title').textContent='📋 Consultar vehículo';input.value='';input.focus()};if(initial)load();</script></body></html>
