<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Expediente del vehículo</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#111)}.wrap{max-width:720px;margin:auto;padding:18px}.card{background:var(--tg-theme-secondary-bg-color,#f3f3f3);border-radius:14px;padding:14px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.label{opacity:.65}.badge{font-weight:800}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.gallery img{width:100%;border-radius:10px;display:block}.event{padding:10px 0;border-bottom:1px solid rgba(128,128,128,.2)}h1,h2{margin:8px 0 12px}button,input{box-sizing:border-box;width:100%;padding:14px;border-radius:12px;font-size:16px;margin:6px 0}button{border:0;font-weight:700;background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff)}input{border:1px solid rgba(128,128,128,.35);background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#111);text-transform:uppercase}.err{color:#b00020}.small{font-size:12px;opacity:.65}</style></head><body><div class="wrap"><h1 id="title">📋 Consultar vehículo</h1><div id="search" class="card"><input id="plate" placeholder="Matrícula" autocomplete="off"><button id="go">CONSULTAR</button></div><div id="status" class="card" style="display:none"></div><div id="content" style="display:none"><div class="card" id="summary"></div><div class="card" id="location"></div><div class="card"><h2>📷 Fotos y documentación</h2><div id="gallery" class="gallery"></div></div><div class="card"><h2>🔎 Verificaciones OCR</h2><div id="ocr"></div></div><div class="card"><h2>📜 Historial completo</h2><div id="events"></div></div><button id="another">🔎 CONSULTAR OTRO VEHÍCULO</button></div><div class="small">Expediente dentro de Telegram · los enlaces de evidencia son temporales</div></div><script>const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();}const API='https://mvexykcxnpaywkbnoxwu.supabase.co/functions/v1/vehicle-consult-api';const input=document.getElementById('plate'),go=document.getElementById('go'),search=document.getElementById('search'),status=document.getElementById('status'),content=document.getElementById('content');const initial=(new URLSearchParams(location.search).get('plate')||'').toUpperCase();if(initial)input.value=initial;const fmt=d=>d?new Date(d).toLocaleString('es-ES'):'—';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const plate=input.value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(plate.length<4){status.style.display='block';status.innerHTML='<span class="err">Introduce una matrícula válida.</span>';return}if(!tg||!tg.initData){status.style.display='block';status.innerHTML='<span class="err">Esta página debe abrirse desde Telegram.</span>';return}go.disabled=true;status.style.display='block';status.textContent='Cargando expediente…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData,plate})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error==='not_found'?'Vehículo no encontrado':d.error||'No se pudo cargar');render(d)}catch(e){status.innerHTML='<span class="err">'+esc(e.message||e)+'</span>'}finally{go.disabled=false}}function render(d){const v=d.vehicle;document.getElementById('title').textContent='📋 '+v.plate;search.style.display='none';status.style.display='none';content.style.display='block';document.getElementById('summary').innerHTML='<div class="row"><span class="label">Estado</span><span class="badge">'+esc(v.status)+'</span></div><div class="row"><span class="label">Aparcado</span><span>'+fmt(v.parked_at)+'</span></div><div class="row"><span class="label">Última actualización</span><span>'+fmt(v.updated_at)+'</span></div>';let loc='';if(v.current_lat!=null&&v.current_lng!=null){const map='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(v.current_lat+','+v.current_lng)+'&travelmode=walking&dir_action=navigate';loc+='<div class="row"><span class="label">GPS</span><span>'+Number(v.current_lat).toFixed(6)+', '+Number(v.current_lng).toFixed(6)+'</span></div><div class="row"><span class="label">Precisión</span><span>'+(v.current_accuracy_m==null?'—':'±'+Math.round(v.current_accuracy_m)+' m')+'</span></div><button onclick="location.href=\''+map+'\'">🧭 NAVEGAR HASTA EL COCHE</button>'}if(v.current_location_text)loc+='<div class="row"><span class="label">Referencia</span><span>'+esc(v.current_location_text)+'</span></div>';document.getElementById('location').innerHTML='<h2>📍 Ubicación</h2>'+loc;const g=document.getElementById('gallery');g.innerHTML=d.evidence.length?d.evidence.map(e=>e.signed_url?'<a href="'+esc(e.signed_url)+'"><img src="'+esc(e.signed_url)+'" alt="'+esc(e.evidence_type)+'"></a>':'<div>'+esc(e.evidence_type)+'<br>'+esc(e.stage)+'</div>').join(''):'Sin evidencias';document.getElementById('ocr').innerHTML=d.verifications.length?d.verifications.map(x=>'<div class="event"><b>'+esc(x.result.toUpperCase())+'</b> · '+esc(x.stage)+'<br>Esperada: '+esc(x.expected_plate)+' · Detectada: '+esc(x.detected_plate||'—')+'<br><span class="small">'+fmt(x.created_at)+(x.worker?' · '+esc(x.worker.full_name):'')+'</span></div>').join(''):'Sin verificaciones';document.getElementById('events').innerHTML=d.events.length?d.events.map(e=>'<div class="event"><b>'+esc(e.operation)+'</b><br>'+esc(e.location_text||'')+'<br><span class="small">'+fmt(e.created_at)+(e.worker?' · '+esc(e.worker.full_name):'')+'</span></div>').join(''):'Sin historial'}go.onclick=load;input.addEventListener('keydown',e=>{if(e.key==='Enter')load()});document.getElementById('another').onclick=()=>{content.style.display='none';search.style.display='block';document.getElementById('title').textContent='📋 Consultar vehículo';input.value='';input.focus()};if(initial)load();</script></body></html>
