name: Stable Release Guard

on:
  push:
    branches: [main]
    paths:
      - 'docs/preview-modern/**'
      - 'docs/STABLE_RELEASE.md'
      - '.github/workflows/stable-release-guard.yml'
  pull_request:
    paths:
      - 'docs/preview-modern/**'
      - 'docs/STABLE_RELEASE.md'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify stable release contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version:"1.4.0"' docs/preview-modern/release.js
          grep -q 'build:"2026.09.04.02"' docs/preview-modern/release.js
          grep -q 'PLANIFICACIÓN · ADMIN' docs/preview-modern/index.html
          grep -q 'RESERVAS · ADMIN' docs/preview-modern/index.html
          grep -q 'ACCESOS · ADMIN' docs/preview-modern/index.html
          grep -q 'OPTIMIZACIÓN · ADMIN' docs/preview-modern/index.html
          grep -q 'SOPORTE · ADMIN' docs/preview-modern/index.html
          grep -q 'DIAGNÓSTICO' docs/preview-modern/index.html
          grep -q 'admin-only' docs/preview-modern/index.html
          grep -q 'Root/desarrollador no participa' docs/preview-modern/ai-dispatch.html
          grep -q 'Build 2026.09.04.02' docs/STABLE_RELEASE.md
