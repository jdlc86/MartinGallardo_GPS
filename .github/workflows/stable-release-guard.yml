name: Stable Release Guard

on:
  push:
    branches: [main]
    paths:
      - 'release/manifest.json'
      - 'docs/preview-modern/**'
      - 'docs/STABLE_RELEASE.md'
      - '.github/workflows/stable-release-guard.yml'
      - '.github/workflows/deployed-release-verification.yml'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
  pull_request:
    paths:
      - 'release/manifest.json'
      - 'docs/preview-modern/**'
      - 'docs/STABLE_RELEASE.md'
      - '.github/workflows/stable-release-guard.yml'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'

jobs:
  release-contract:
    name: Release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate canonical release manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path(".")
          manifest = json.loads((root / "release/manifest.json").read_text(encoding="utf-8"))

          required = {"schema","product","release_status","version","build","released_at","frontend","backend","optimizer"}
          missing = sorted(required - manifest.keys())
          if missing:
              raise SystemExit(f"manifest missing keys: {missing}")
          if manifest["schema"] != 1:
              raise SystemExit("unsupported release manifest schema")
          if manifest["product"] != "ParkingMartin-G":
              raise SystemExit("unexpected product")
          if manifest["release_status"] not in {"candidate","stable"}:
              raise SystemExit("release_status must be candidate or stable")

          version = manifest["version"]
          build = manifest["build"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"invalid version: {version}")
          m = re.fullmatch(r"(\d{4})\.(\d{2})\.(\d{2})\.(\d{2})", build)
          if not m:
              raise SystemExit(f"invalid build: {build}")

          build_token = build.replace(".", "")
          app_rev = f"{m.group(1)}{m.group(2)}{m.group(3)}B{m.group(4)}"
          sw_cache = manifest["frontend"]["service_worker_cache"]

          def read(path):
              return (root / path).read_text(encoding="utf-8")

          release_js = read("docs/preview-modern/release.js")
          stable_doc = read("docs/STABLE_RELEASE.md")
          system_info = read("docs/preview-modern/system-info.html")
          sw = read("docs/preview-modern/sw.js")
          index = read("docs/preview-modern/index.html")
          backend = read("supabase/functions/reservation-optimization-jobs-v1/index.ts")
          gateway = read("supabase/functions/telegram-gateway/index.ts")
          modern_action = read("supabase/functions/telegram-modern-action/index.ts")

          checks = [
              (f'version:"{version}"' in release_js, "release.js version"),
              (f'build:"{build}"' in release_js, "release.js build"),
              (f"**Versión:** {version}" in stable_doc, "STABLE_RELEASE version"),
              (f"**Build estable:** {build}" in stable_doc, "STABLE_RELEASE build"),
              (f"v{version} · Build {build}" in stable_doc, "STABLE_RELEASE display build"),
              (f"release.js?v={build_token}" in system_info, "system-info release asset token"),
              (f"./release.js?v={build_token}" in sw, "service worker release asset token"),
              (f"release.js?v={build_token}" in index, "index release asset token"),
              (f"const CACHE='{sw_cache}';" in sw, "service worker cache id"),
              (f'const BACKEND_VERSION = "{manifest["backend"]["version"]}";' in backend, "backend version"),
              (f'const BACKEND_BUILD = "{manifest["backend"]["build"]}";' in backend, "backend build"),
              (f"preview-modern/?v={app_rev}" in gateway, "telegram-gateway app revision"),
              (f"preview-modern/?v={app_rev}" in modern_action, "telegram-modern-action app revision"),
              (f'optimizer_version = {manifest["optimizer"]["version"]}' in stable_doc, "optimizer version documentation"),
              (f'optimizer_build = {manifest["optimizer"]["build"]}' in stable_doc, "optimizer build documentation"),
          ]

          failures = [name for ok, name in checks if not ok]
          if failures:
              for name in failures:
                  print(f"FAIL: {name}")
              raise SystemExit("release contract mismatch")

          attestations = manifest["backend"].get("attestations", {})
          critical = manifest["backend"]["critical_edge_functions"]
          if set(attestations) != set(critical):
              raise SystemExit("backend.attestations must exactly match critical_edge_functions")

          for slug in critical:
              path = root / "supabase/functions" / slug / "index.ts"
              if not path.is_file():
                  raise SystemExit(f"critical Edge Function missing from repository: {slug}")
              source = path.read_text(encoding="utf-8")
              revision = attestations[slug]
              required_attestation = [
                  'const RELEASE_PRODUCT="ParkingMartin-G";',
                  f'const RELEASE_VERSION="{manifest["backend"]["version"]}";',
                  f'const RELEASE_BUILD="{manifest["backend"]["build"]}";',
                  f'const RELEASE_SOURCE_REVISION="{revision}";',
                  'searchParams.get("attest")',
              ]
              missing_attestation = [x for x in required_attestation if x not in source]
              if missing_attestation:
                  raise SystemExit(f"release attestation mismatch in {slug}: {missing_attestation}")

          print(f"Release contract OK: v{version} · Build {build}")
          print(f"Telegram revision: {app_rev}")
          print(f"Service Worker: {sw_cache}")
          PY

      - name: Verify canonical theme runtime token
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re

          root = pathlib.Path("docs/preview-modern")
          refs = {}
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".html", ".js"}:
                  continue
              text = path.read_text(encoding="utf-8")
              versions = sorted(set(re.findall(r"theme\.js\?v=([A-Za-z0-9._-]+)", text)))
              if versions:
                  refs[str(path)] = versions

          all_versions = sorted({v for versions in refs.values() for v in versions})
          if all_versions != ["12"]:
              details = "; ".join(f"{p}: {','.join(v)}" for p, v in sorted(refs.items()))
              raise SystemExit(f"theme.js cache token mismatch; expected only v=12, found {all_versions}. {details}")
          print(f"Canonical theme runtime token: v=12 across {len(refs)} references")
          PY

      - name: Verify stable operator Home shell contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          html = Path("docs/preview-modern/index.html").read_text(encoding="utf-8")
          forbidden = [
              "body:not(.home-ready) .home-viewbar",
              "body:not(.home-ready) #homeGrid",
          ]
          present = [token for token in forbidden if token in html]
          if present:
              raise SystemExit("Home shell must not be visually blocked by dashboard: " + ", ".join(present))

          common_operation = [
              ">Centro de Operaciones<",
              ">Vehículos<",
              ">Equipo en vivo<",
              ">Actividad reciente<",
          ]
          admin_operation = 'id="taskDispatch"'
          positions = [html.find(token) for token in common_operation]
          admin_pos = html.find(admin_operation)
          if any(pos < 0 for pos in positions) or admin_pos < 0:
              raise SystemExit("Home shell contract elements missing")
          if positions != sorted(positions) or admin_pos <= max(positions):
              raise SystemExit("Admin operation card must remain after all common operation cards")

          expediente = html.find(">Expediente 360º<")
          reservations = html.find('id="reservationsAdmin"')
          team_access = html.find('id="teamAccess"')
          if min(expediente, reservations, team_access) < 0 or not (expediente < reservations < team_access):
              raise SystemExit("Admin management cards must remain after the common management card")

          gps = html.find(">GPS Pro · Diagnóstico<")
          optimizer = html.find('id="optimizerSettings"')
          system_info = html.find('id="systemInfo"')
          if min(gps, optimizer, system_info) < 0 or not (gps < optimizer < system_info):
              raise SystemExit("Admin system cards must remain after the common system card")

          print("Stable operator Home shell contract: OK")
          PY

      - name: Verify owner-only resource observability contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          home = Path("docs/preview-modern/index.html").read_text(encoding="utf-8")
          api = Path("supabase/functions/telegram-modern-action/index.ts").read_text(encoding="utf-8")
          migration = Path("supabase/migrations/20260909001500_owner_resource_observability.sql").read_text(encoding="utf-8")
          analytics_migration = Path("supabase/migrations/20260909020500_resource_usage_analytics.sql").read_text(encoding="utf-8")

          required_home = [
              'id="resourceObservability" class="card owner-only"',
              ">Recursos & presupuestos<",
              "if(d.role==='owner'){document.getElementById('resourceObservability').classList.remove('owner-only')}",
          ]
          missing = [x for x in required_home if x not in home]
          if missing:
              raise SystemExit("Owner resource tile contract missing: " + ", ".join(missing))

          system_info = home.find('id="systemInfo"')
          owner_card = home.find('id="resourceObservability"')
          if system_info < 0 or owner_card <= system_info:
              raise SystemExit("Owner resource card must remain after admin System cards")

          required_api = [
              'async function requireOwner',
              'action==="resource_observability"',
              'action==="resource_budget_update"',
              'action==="resource_analytics_refresh"',
              'Deno.env.get("ANALYTICS_ACCESS_TOKEN")',
              'throw new Error("not_owner")',
          ]
          missing_api = [x for x in required_api if x not in api]
          if missing_api:
              raise SystemExit("Owner backend authorization contract missing: " + ", ".join(missing_api))

          required_db = [
              "alter table public.resource_observability_config enable row level security",
              "revoke all on table public.resource_observability_config from public, anon, authenticated",
              "security definer",
              "revoke all on function public.resource_observability_snapshot()",
          ]
          missing_db = [x for x in required_db if x not in migration.lower()]
          if missing_db:
              raise SystemExit("Resource observability DB hardening missing: " + ", ".join(missing_db))

          required_analytics_db = [
              "alter table public.resource_usage_snapshots enable row level security",
              "revoke all on table public.resource_usage_snapshots from public, anon, authenticated",
              "api_requests_budget",
              "edge_function_invocations_budget",
          ]
          missing_analytics_db = [x for x in required_analytics_db if x not in analytics_migration.lower()]
          if missing_analytics_db:
              raise SystemExit("Resource analytics DB hardening missing: " + ", ".join(missing_analytics_db))

          print("Owner-only resource observability contract: OK")
          PY

      - name: Verify Telegram native Android Back contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          nav = Path("docs/preview-modern/navigation-runtime.js").read_text(encoding="utf-8")
          required = {
              "Telegram BackButton binding": 'const tgBack=tg?.BackButton||null;',
              "native BackButton handler": 'tgBack.onClick(runBack);',
              "native BackButton visible internally": 'tgBack.show();',
              "native BackButton hidden on Home": 'if(cfg?.root){tgBack.hide();return}',
              "History API fallback disabled inside Telegram": 'if(nativeBack||armed)return;',
              "popstate ignored inside Telegram": 'if(nativeBack||!armed)return;',
          }
          missing = [name for name, token in required.items() if token not in nav]
          if missing:
              raise SystemExit("Telegram native Android Back contract missing: " + ", ".join(missing))
          print("Telegram native Android Back contract: OK")
          PY

      - name: Require revision bump when a critical Edge Function changes
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
          fi
          python3 - "$BEFORE" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          before = sys.argv[1]
          current = json.loads(pathlib.Path("release/manifest.json").read_text(encoding="utf-8"))
          new_map = current["backend"]["attestations"]
          try:
              old_text = subprocess.check_output(["git","show",f"{before}:release/manifest.json"], text=True)
              old = json.loads(old_text)
              old_map = old.get("backend",{}).get("attestations",{})
          except Exception:
              old_map = {}

          failures = []
          for slug, new_revision in new_map.items():
              path = f"supabase/functions/{slug}/index.ts"
              changed = subprocess.run(["git","diff","--quiet",before,"HEAD","--",path]).returncode != 0
              if changed and old_map.get(slug) == new_revision:
                  failures.append(slug)

          if failures:
              raise SystemExit("critical Edge Function changed without revision bump: " + ", ".join(failures))
          print("Critical Edge Function revision bumps are coherent.")
          PY

      - name: Verify protected realtime flows have no polling regression
        shell: bash
        run: |
          set -euo pipefail
          protected_files=(
            docs/preview-modern/notification-runtime.js
            docs/preview-modern/reservations-admin.html
            docs/preview-modern/ai-dispatch.html
            docs/preview-modern/ai-dispatch-runtime.js
          )
          if grep -nE 'setInterval\s*\(' "${protected_files[@]}"; then
            echo "Periodic polling detected in a protected realtime/event-driven flow."
            exit 1
          fi
          if grep -nE 'setInterval\s*\(\s*load\s*,' docs/preview-modern/team-live.html; then
            echo "Backend polling detected in team-live.html."
            exit 1
          fi
          echo "No periodic backend polling detected in protected flows."
