name: Optimizer V2

on:
  pull_request:
    paths:
      - 'optimizer_v2/**'
      - 'supabase/functions/reservation-optimization-jobs-v1/**'
      - 'supabase/migrations/*optimizer_v2*'
      - '.github/workflows/optimizer-v2.yml'
  push:
    branches:
      - 'refactor/optimizer-v2-ortools'
    paths:
      - 'optimizer_v2/**'
      - 'supabase/functions/reservation-optimization-jobs-v1/**'
      - 'supabase/migrations/*optimizer_v2*'
      - '.github/workflows/optimizer-v2.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: optimizer_v2
    env:
      PYTHONPATH: ${{ github.workspace }}/optimizer_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: optimizer_v2/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  benchmark-150:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: optimizer_v2
    env:
      PYTHONPATH: ${{ github.workspace }}/optimizer_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: optimizer_v2/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m parking_optimizer.benchmark
