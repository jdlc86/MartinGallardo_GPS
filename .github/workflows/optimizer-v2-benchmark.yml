name: Optimizer V2 Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - 'refactor/optimizer-v2-ortools'
    paths:
      - 'optimizer_v2/**'
      - '.github/workflows/optimizer-v2-benchmark.yml'

jobs:
  benchmark-150:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/optimizer_v2
      BACK_FORWARD_BENCHMARK_MODE: optimal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: optimizer_v2/requirements.txt
      - working-directory: optimizer_v2
        run: pip install -r requirements.txt
      - working-directory: optimizer_v2
        run: python -m parking_optimizer.benchmark
