name: Deployed Release Verification

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pages:
    name: Verify deployed Pages release
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment.environment == 'github-pages' && github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          fetch-depth: 1

      - name: Determine whether this deployment is the current production head
        id: current
        shell: bash
        run: |
          set -euo pipefail
          RUN_SHA="${{ github.event.deployment.sha || github.sha }}"
          MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "run_sha=$RUN_SHA"
          echo "main_sha=$MAIN_SHA"
          if [ "$RUN_SHA" = "$MAIN_SHA" ]; then
            echo "is_current=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_current=false" >> "$GITHUB_OUTPUT"
            echo "Historical deployment: a newer main commit exists. Live production will not be judged against this old SHA."
          fi

      - name: Read expected release
        if: steps.current.outputs.is_current == 'true'
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          import re
          m = json.load(open("release/manifest.json", encoding="utf-8"))
          build = m["build"]
          match = re.fullmatch(r"(\d{4})\.(\d{2})\.(\d{2})\.(\d{2})", build)
          if not match:
              raise SystemExit("invalid build in release manifest")
          print(f"EXPECTED_VERSION={m['version']}")
          print(f"EXPECTED_BUILD={build}")
          print(f"EXPECTED_BUILD_TOKEN={build.replace('.', '')}")
          print(f"EXPECTED_SW_CACHE={m['frontend']['service_worker_cache']}")
          print(f"EXPECTED_SW_REV={m['frontend']['service_worker_cache'].rsplit('v',1)[-1]}")
          PY

      - name: Verify live GitHub Pages content
        if: steps.current.outputs.is_current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://jdlc86.github.io/MartinGallardo_GPS/preview-modern"
          BUST="${{ github.event.deployment.sha || github.sha }}"

          curl -fsSL --retry 3 "$BASE/release.js?verify=$BUST" -o /tmp/release.js
          curl -fsSL --retry 3 "$BASE/sw.js?verify=$BUST" -o /tmp/sw.js
          curl -fsSL --retry 3 "$BASE/index.html?verify=$BUST" -o /tmp/index.html

          grep -Fq "version:\"$EXPECTED_VERSION\"" /tmp/release.js
          grep -Fq "build:\"$EXPECTED_BUILD\"" /tmp/release.js
          grep -Fq "const CACHE='$EXPECTED_SW_CACHE';" /tmp/sw.js
          grep -Fq "release.js?v=$EXPECTED_BUILD_TOKEN" /tmp/index.html
          grep -Fq "sw.js?v=$EXPECTED_SW_REV" /tmp/index.html

          echo "Live Pages release verified: v$EXPECTED_VERSION · Build $EXPECTED_BUILD"
          echo "Service Worker verified: $EXPECTED_SW_CACHE"

      - name: Verify live Supabase Edge Function attestations
        if: steps.current.outputs.is_current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://mvexykcxnpaywkbnoxwu.supabase.co/functions/v1"

          python3 - <<'PY' > /tmp/pmg-attestations.tsv
          import json
          m=json.load(open("release/manifest.json",encoding="utf-8"))
          for slug,revision in m["backend"]["attestations"].items():
              print(f"{slug}\t{revision}\t{m['backend']['version']}\t{m['backend']['build']}")
          PY

          while IFS=\t' read -r slug revision version build; do
            url="$BASE/$slug?attest=1"
            curl -fsSL --retry 3 --connect-timeout 10 --max-time 20 "$url" -o "/tmp/$slug.json"
            python3 - "$slug" "$revision" "$version" "$build" "/tmp/$slug.json" <<'PY'
          import json,sys
          slug,revision,version,build,path=sys.argv[1:]
          data=json.load(open(path,encoding="utf-8"))
          expected={
              "ok": True,
              "product": "ParkingMartin-G",
              "function": slug,
              "version": version,
              "build": build,
              "source_revision": revision,
          }
          mismatches={k:(data.get(k),v) for k,v in expected.items() if data.get(k)!=v}
          if mismatches:
              raise SystemExit(f"{slug} attestation mismatch: {mismatches}")
          print(f"{slug}: attestation OK")
          PY
          done < /tmp/pmg-attestations.tsv

          echo "All critical Supabase Edge Function attestations verified."
